<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Examined System: philosophical ethics for people who build AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --surface:#F1F0EB; --ink:#000; --muted:#5E5E58; --rule:#D6D5CF;
  --red:#C33A22; --yellow:#E3AE1C; --blue:#1D5A9E; --focus:#1D5A9E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
    --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
  --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Libre Caslon Text","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:18px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
main{max-width:680px; margin:0 auto; padding:40px 22px 96px}
main:focus{outline:none}
h1,h2,h3{font-weight:400; line-height:1.15; margin:0}
p{margin:0 0 .9em}
a{color:var(--blue)}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:15px; line-height:1.5}

/* Hero */
.hero{padding:24px 0 36px; border-bottom:1px solid var(--rule); margin-bottom:36px}
.hero h1{font-size:clamp(44px,11vw,82px); letter-spacing:-.02em; margin:14px 0 12px}
.hero .lede{font-size:21px; font-style:italic; max-width:30em; margin:0}
.trio{display:block}

/* Next up */
.next{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin:0 0 44px}
.next p{margin:0; flex:1 1 260px}

/* Buttons */
.btn{
  appearance:none; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:10px 20px; border-radius:2px; cursor:pointer; font-size:17px; line-height:1.3;
}
.btn:hover{background:var(--blue); border-color:var(--blue)}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover{background:var(--surface); color:var(--ink); border-color:var(--ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--blue); padding:10px 6px; text-decoration:underline; text-underline-offset:3px}
.btn.quiet:hover{background:transparent; color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:default}

/* Sections */
.sec{margin:0 0 48px}
.sec h2{font-size:30px; margin-bottom:6px}
.sec > .muted{margin-bottom:18px}

/* The path */
.books{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.books li{border-bottom:1px solid var(--rule)}
.book{
  display:grid; grid-template-columns:44px 1fr auto; gap:16px; align-items:center;
  width:100%; text-align:left; background:none; border:0; padding:16px 4px; cursor:pointer;
}
.book:hover{background:var(--surface)}
.book[disabled]{cursor:default; opacity:.55}
.book[disabled]:hover{background:none}
.book .num{font-size:14px; color:var(--muted); display:block}
.book .title{font-size:21px; display:block; line-height:1.25}
.book .gist{font-size:15px; color:var(--muted); display:block; line-height:1.45; margin-top:2px}
.state{font-size:14px; color:var(--muted); text-align:right; max-width:11em}
.state.done{color:var(--blue); font-style:italic}
.dots{display:inline-flex; gap:3px; margin-top:4px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--rule); display:block}
.dots i.y{background:var(--blue)} .dots i.n{background:var(--red)}

/* Reading */
.back{margin:0 0 20px}
.unit-head{display:flex; gap:18px; align-items:flex-start; margin-bottom:22px}
.unit-head h1{font-size:clamp(34px,8vw,50px); letter-spacing:-.01em}
.unit-head .num{color:var(--muted); font-size:16px}
.unit-head .gist{font-style:italic; margin:6px 0 0}
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer; padding:14px 0; font-size:20px; list-style:none; display:flex; justify-content:space-between; align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--muted); font-size:22px}
details[open] summary::after{content:"−"}
.reading{padding:0 0 18px}
.reading .ex,.ex{background:var(--surface); padding:12px 16px; margin:4px 0 14px; border-left:3px solid var(--blue)}

/* Dialogue */
.part{font-size:19px; color:var(--muted); margin:26px 0 10px}
.dlg,.practice,.coachsec{margin-top:44px}
.dlg h2,.practice h2,.coachsec h2{font-size:28px; margin-bottom:6px}
.scene{background:var(--surface); border-left:3px solid var(--yellow); padding:14px 18px 6px; margin:14px 0 22px}
.scene .muted{margin-bottom:6px}
.turn{margin:0 0 16px; padding:2px 0 2px 16px; border-left:3px solid var(--rule); white-space:pre-wrap}
.turn p{margin:0}
.turn.q{border-left-color:var(--red)}
.turn.you{border-left-color:var(--blue)}
.turn.note{border-left-color:var(--yellow); color:var(--muted); font-style:italic}
.who{display:block; font-size:14px; color:var(--muted); font-style:normal}
.opt{
  display:block; width:100%; text-align:left; padding:12px 14px; margin:0 0 10px; cursor:pointer;
  border:1.5px solid var(--ink); background:var(--paper); border-radius:2px; line-height:1.45;
}
.opt:hover{background:var(--surface)}
.opt[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.opt.right{border-color:var(--blue); background:var(--surface)}
.opt.wrong{border-color:var(--red)}
.opt[disabled]{cursor:default; opacity:1}
label.fl{display:block; margin:18px 0 4px; font-size:16px}
textarea.write{
  width:100%; min-height:96px; font-family:inherit; font-size:17px; line-height:1.5; padding:10px 12px;
  border:1.5px solid var(--ink); background:var(--paper); border-radius:2px; margin:0 0 8px; resize:vertical;
}
.err{color:var(--red); font-size:15px; margin-top:8px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* Practice */
.practice-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.prop{border:1.5px solid var(--ink); padding:26px 24px 22px; margin-top:12px}
.prop .label{font-size:14px; color:var(--muted); margin-bottom:10px}
.qt{font-size:22px; line-height:1.45; margin:0 0 20px}
.feedback{margin-top:16px; min-height:1px}
.verdict{font-size:21px; margin:0 0 6px}
.verdict.ok{color:var(--blue)} .verdict.bad{color:var(--red)}

/* Tensions and ledger */
.commit{border-top:1px solid var(--rule); padding:14px 0}
.commit:last-child{border-bottom:1px solid var(--rule)}
.commit h3{font-size:20px; margin-bottom:4px}
.commit .lab{font-size:15px; color:var(--muted)}
.tension{border:1.5px solid var(--red); padding:18px 18px 12px; margin:18px 0}
.tension h3{font-size:22px; margin-bottom:8px}
.tension ul{margin:0 0 12px; padding-left:1.2em; font-size:16px}
.tension .how .opt{display:inline-block; width:auto; margin:0 8px 8px 0; padding:8px 12px; font-size:16px}
.tension.settled{border-color:var(--rule)}

/* Examiner */
.coach{border:1.5px dashed var(--muted); padding:18px 18px 14px; margin-top:14px}
.coach .turn.q{border-left-color:var(--yellow)}
.coach textarea.write{min-height:72px}

/* Hearing */
.xq{border-top:1px solid var(--rule); padding:14px 0 6px}
.xq p{margin-bottom:6px}

/* Record */
textarea.json{width:100%; min-height:150px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; padding:10px; border:1.5px solid var(--rule); background:var(--surface); border-radius:2px; margin:10px 0}
.sync{font-size:14px; color:var(--muted); margin-top:12px}

@media (max-width:520px){
  body{font-size:17px}
  main{padding:28px 18px 80px}
  .book{grid-template-columns:36px 1fr}
  .book .state{grid-column:2; text-align:left; max-width:none}
  .prop{padding:20px 16px 18px}
}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .5s ease-out}
  @keyframes flash{from{background:var(--surface)} to{background:transparent}}
}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>

<script>
"use strict";
/* ===== Course content, part 1: modules 1-4 =====
   Item convention: o[0] is always the correct option; the page shuffles at display time. */
const MODS=[];

MODS.push({
id:"resp", n:1, title:"Responsibility", gist:"Who answers for what a system does?", glyph:"resp",
reads:[
{t:"The question", h:"<p>Engineers often say, “the model made the decision.” That sentence is meant to move responsibility somewhere else. Whether it can depends on what responsibility is.</p><p>In ordinary life we hold someone responsible for an outcome when three things are roughly true: they contributed causally, they knew or could have known the risk, and they had some control over what happened. Machine learning strains all three. Causal chains run through many people, failures can be emergent, and control is partial.</p><p>Two questions get run together. <i>Accountability</i> is being answerable: you must explain, repair, and answer to those harmed. <i>Blameworthiness</i> is deserving moral criticism. A company can owe compensation for a defective device without any employee being blameworthy. Keep the questions apart and many arguments get clearer.</p>"},
{t:"The positions", h:"<p><b>Developer-centred.</b> Those who build and profit from a capability set the risk, understand the system best, and can fix it, so they bear primary responsibility. Its weakness: it can blame the most capable party even when they did everything reasonable and someone overrode their safeguards.</p><p><b>Distributed.</b> Many hands contribute, and responsibility is shared in proportion to contribution, knowledge, and power. The political theorist Dennis Thompson called the danger the “problem of many hands”: when everyone owns a sliver, no one answers.</p><p><b>User-centred.</b> The person who chooses to use a tool is responsible for how it is used. Its weakness: users often cannot know a system’s limits, and sometimes the choice was made for them by the workflow they were given.</p><p>Philosophers have also asked whether learning systems open a <i>responsibility gap</i> (Andreas Matthias’s phrase): actions no one could have predicted or controlled, so that no one meets the traditional conditions. One reply is that foreseeing a <i>class</i> of failure can be enough to ground duties to test, monitor, and prepare.</p>"},
{t:"In the machine", h:"<p>The practical form of these questions is organisational: naming an owner for each risk, writing down who may approve a release, and keeping logs good enough to reconstruct what happened.</p><p>Watch for the moral alibi. A review that everyone signs can spread responsibility so thin that the signature means nothing. A useful test: could you explain, to the person who was harmed, who decided what, and why?</p><div class=\"ex\">Your view on this matters later. In the hearing at the end of the course, you will be asked who answers for a release.</div>"}
],
dlg:{
setup:"A hospital uses a triage-support model you helped build. Its documentation says it was validated on adults. A clinician, short on time, uses it on a seventeen-year-old; it underestimates severity and the patient is harmed. The vendor’s contract says the hospital is responsible for appropriate use. The hospital says it relied on the vendor’s validation. The training team says adolescents were outside the project’s scope.",
claim:"Who bears primary responsibility for the harm?",
pos:[
{id:"a", fam:"resp-dev", text:"The people who built and sold the system.",
 obj:"Suppose the documentation clearly said “not validated for patients under 18,” the screen showed a warning, and the hospital turned the warning off to speed up its workflow. Your principle still puts primary responsibility on the developers. Does it?",
 bite:"Then you hold developers primarily responsible even when they warned clearly and someone overrode the warning. A ladder maker is not usually blamed when a ladder is used against its instructions. Is yours a principle about responsibility, or about blaming whoever is most capable?",
 tag:{id:"resp-dev-1", label:"Builders bear primary responsibility, whatever others do."},
 refine:{text:"Developers bear primary responsibility unless they gave adequate warning and the deployer knowingly overrode it.",
  reply:"That makes your principle turn on “adequate warning.” Suppose warnings appear on every screen and are routinely ignored, and the developers know it. Is a warning you know will be ignored adequate?",
  tag:{id:"resp-dev-2", label:"Builders bear primary responsibility unless they gave adequate warning that was knowingly overridden."}}},
{id:"b", fam:"resp-shared", text:"Everyone involved, in proportion to their contribution.",
 obj:"Suppose each party can truthfully say, “my share of the cause was small and I met my obligations.” If responsibility is cut into slivers like that, who must explain to the patient’s family, pay for care, and fix the system?",
 bite:"Then you accept that the family may find no one answerable. The more hands involved, the less anyone answers. That is the pattern Thompson called the problem of many hands. Can you accept that outcome?",
 tag:{id:"resp-shared-1", label:"Responsibility is divided in proportion to contribution."},
 refine:{text:"Responsibility is shared in proportion, but one named party is always answerable to the harmed person and may then recover from the others.",
  reply:"Who picks the answerable party, and on what ground? If it is whoever has the deepest pockets, you have rebuilt a liability rule, not a theory of responsibility. If it is whoever had the most control, is that the developer, the hospital, or the clinician?",
  tag:{id:"resp-shared-2", label:"Responsibility is shared in proportion, with one named party always answerable."}}},
{id:"c", fam:"resp-user", text:"Whoever chose to use the system in this case.",
 obj:"Suppose the clinician had no way to learn the model’s limits: the documentation was buried, training was a ten-minute video, and the hospital required the tool for every patient. Does the clinician bear primary responsibility?",
 bite:"Then you hold responsible a person who lacked the knowledge and control that responsibility ordinarily requires. Can we say the clinician “chose” when the choice was, in practice, made for them?",
 tag:{id:"resp-user-1", label:"The person who chooses to use a system bears primary responsibility."},
 refine:{text:"The user is responsible when they had the knowledge and freedom to choose otherwise; if not, responsibility moves to whoever set the conditions.",
  reply:"Now your principle depends on who set the conditions. In this story the developers chose the scope and the hospital chose the workflow. How do you decide which of them set the conditions for this harm, and have you left the user-centred view behind?",
  tag:{id:"resp-user-2", label:"The user is responsible when informed and free; otherwise whoever set the conditions is."}}}
]},
items:[
{q:"“The model made the decision, so no person is responsible.” Which hidden premise does this argument need?", o:["Responsibility attaches only to whoever makes the final decision in the moment.","Machine decisions are always accurate.","Humans can never be responsible for machine-made decisions.","Responsibility cannot be shared among several parties."], a:0, why:"The argument assumes responsibility sits only at the moment of decision. We routinely hold people responsible for setting up conditions: choosing to deploy, ignoring known risks, skipping tests. The third option merely restates the conclusion."},
{q:"A company must compensate patients harmed by its device, though no employee acted negligently. What does this case show?", o:["Someone can be accountable (answerable) without being blameworthy.","The company must be blameworthy.","Responsibility requires intention.","No one is accountable."], a:0, why:"Accountability is about being answerable and making repair. Blameworthiness is about deserving moral criticism. Strict liability pulls the two apart."},
{q:"“Everyone on the team followed the process, so no one did anything wrong.” What is the main flaw?", o:["The process itself may be inadequate, and following a flawed process does not show innocence.","It appeals to an irrelevant authority.","It assumes only one person can be responsible.","It is circular."], a:0, why:"Compliance with a procedure is not the same as acting well. If the process could not catch a foreseeable harm, the people who designed or relied on it may still answer for the outcome."},
{q:"Which situation best illustrates the “problem of many hands”?", o:["A harm results from data collectors, labelers, trainers, and deployers, each contributing a little and each assuming another would catch problems.","One engineer ships a bug that crashes a service.","A user deliberately misuses a tool against its instructions.","A company knowingly ignores a risk its own tests flagged."], a:0, why:"The problem arises when many contribute to a harm and no individual’s contribution is large enough, or knowing enough, to make them answerable. The other cases have a clear individual or organisation to point to."},
{q:"Principle: “Whoever has the most control over a system bears primary responsibility for its harms.” Which case is the best counterexample?", o:["The operating team acts within its safety protocols; a third party deliberately sabotages the system and harm follows.","A developer ignores internal warnings and ships anyway.","A deployer controls the rollout and rushes it.","A vendor controls the model and hides known limits."], a:0, why:"The principle ignores intervening wrongdoing by someone else. The party with the most control did what it should, and another party’s deliberate act produced the harm."},
{q:"A team could not predict the exact failure but could predict that systems like theirs sometimes fail in ways nobody can list in advance. Which claim is best supported?", o:["Foreseeing a class of failure can ground duties to test, monitor, and prepare, even without foreseeing the instance.","They bear no responsibility because the failure was unforeseeable.","They bear full responsibility for every failure.","Responsibility requires certainty about the specific outcome."], a:0, why:"Responsibility does not need foresight of the exact event. If a kind of failure is predictable, we can fault the absence of reasonable safeguards against it."}
]});

MODS.push({
id:"fair", n:2, title:"Fairness", gist:"What do we owe each person a system sorts?", glyph:"fair",
reads:[
{t:"The question", h:"<p>Fairness is not one idea. We use it for equal treatment (the same rule for everyone), equal outcomes (equal shares), equal opportunity, desert, and need. A model that classifies people distributes something: loans, jobs, scrutiny, bail. The question is what justice requires when a system does the sorting.</p><p>Practitioners often start by picking a metric. The prior question is what the metric is meant to protect, and for whom.</p>"},
{t:"The positions", h:"<p>Statistical definitions of fairness work as compressed moral positions.</p><p><b>Parity</b> asks that selection rates be equal across groups. It attends to outcomes and to the lasting effects of past disadvantage.</p><p><b>Equal error rates</b> (including “equal opportunity”) ask that, among people who truly merit the outcome, the same share receive it in each group. It protects the qualified from being overlooked because of group.</p><p><b>Calibration</b> asks that a score mean the same thing for everyone: like cases are treated alike.</p><p>Researchers (Kleinberg and colleagues; Chouldechova) showed that when groups have different base rates, a classifier generally cannot satisfy calibration and equal error rates together, outside trivial cases. So the choice among them is a moral decision, not a technical one.</p><p>John Rawls offered a tool for such choices: ask which rules you would accept behind a “veil of ignorance,” not knowing which position in society you will hold.</p>"},
{t:"In the machine", h:"<p>Before choosing a metric, ask what is being distributed, who is hurt by each kind of error (a wrongful rejection is not the same harm as a wrongful approval), and whether the base rates differ because of past injustice. Report results by subgroup, including intersections, with honest uncertainty.</p><p>A metric does not remove the judgment. It records it. Say what your choice gives up.</p>"}
],
dlg:{
setup:"A lender’s model scores applicants. Repayment rates differ between two groups, partly because of past discrimination in jobs and housing. Whatever threshold is set, the lender must decide which kind of fairness to protect: equal approval rates, equal error rates among those who would repay, or scores that mean the same thing for everyone.",
claim:"Which standard should the lender hold the model to?",
pos:[
{id:"a", fam:"fair-parity", text:"Equal approval rates across the two groups.",
 obj:"Suppose far fewer applicants in group X would in fact repay, perhaps because of the very injustice you want to correct. To equalise approval rates, the lender must approve some higher-risk applicants from X and decline some lower-risk applicants from Y. A lower-risk person in Y is turned down so a higher-risk person in X can be approved. Is that fair to the person from Y?",
 bite:"Then individuals are treated worse for the sake of group outcomes. Many defend that as a remedy for past wrongs, but the cost lands on particular people who did not cause them, and some borrowers may be given loans they struggle to repay. Are you prepared to defend both costs?",
 tag:{id:"fair-parity-1", label:"Equal approval rates are the standard."},
 refine:{text:"Aim at equal approval rates over time, paired with support such as counselling and smaller first loans.",
  reply:"That shifts the question from what the model should do to what the lender should do for applicants. Fair enough, but until the gap closes the model still approves some people over others. What do you say to a declined applicant from Y today, and what fixes how fast the gap should close?",
  tag:{id:"fair-parity-2", label:"Aim at equal approval rates over time, paired with support."}}},
{id:"b", fam:"fair-errors", text:"Equal error rates: among people who would repay, the same share is approved in each group.",
 obj:"With different repayment rates, equalising error rates generally means using different thresholds by group, or reading the same score differently depending on group. Two applicants with identical scores and records may get opposite decisions because of group membership. Is that equal treatment?",
 bite:"Then you accept group-dependent thresholds: explicit use of group membership in decisions, which may be unlawful in some settings. You are saying the chance of being wrongly turned down matters more than being judged by one common rule. Can you defend that to the person who loses under the group-specific rule?",
 tag:{id:"fair-errors-1", label:"Equal error rates are the standard, even at the cost of a common threshold."},
 refine:{text:"Equalise the error that costs most, wrongful rejection of creditworthy people, while keeping one common score for everyone.",
  reply:"Choosing which error to equalise is a claim about which error is worse. Why is wrongly rejecting a creditworthy person worse than wrongly approving someone who then defaults, a harm that falls on the borrower too? Who decided how bad each error is, and who was asked?",
  tag:{id:"fair-errors-2", label:"Equalise wrongful rejection of the creditworthy, with one common score."}}},
{id:"c", fam:"fair-calibration", text:"Calibration: a score should mean the same repayment likelihood for every applicant, whatever their group.",
 obj:"Calibration treats like cases alike. But if the data reflect past discrimination, scores calibrated to that data will faithfully reproduce the disadvantage. Is it fair to be accurate about an unjust world?",
 bite:"Then you hold that the lender’s duty is to be accurate and consistent, and that repairing historic injustice is someone else’s job. That is coherent, but it leaves the disadvantaged group where it is. Who, on your view, has the duty to repair, and are you sure they will?",
 tag:{id:"fair-cal-1", label:"Scores should mean the same for everyone; repair is someone else’s job."},
 refine:{text:"Calibration for the model, plus repair upstream: fix biased measures and bring in better data and alternative evidence of creditworthiness.",
  reply:"Repairing inputs is easier to say than to do. Suppose after your best efforts a gap remains and a decision still must be made today. Does calibration stay in force while the gap persists, and who bears the cost during the repair?",
  tag:{id:"fair-cal-2", label:"Calibrated scores, with upstream repair of biased data and measures."}}}
]},
items:[
{q:"When two groups have different base rates, a classifier generally cannot satisfy which pair of standards at once?", o:["Calibration and equal false-positive and false-negative rates.","High accuracy and any fairness measure.","Calibration and high accuracy.","Equal approval rates and equal accuracy."], a:0, why:"This is the impossibility result associated with Kleinberg and colleagues and with Chouldechova. Outside special cases, you must choose which of the two to give up."},
{q:"A hiring tool selects 30% of male applicants and 15% of female applicants. Which statement is most accurate?", o:["It shows a selection-rate gap, but judging fairness requires asking why the gap exists.","It proves discrimination.","It is fair if the model is accurate overall.","Selection rates are irrelevant to fairness."], a:0, why:"A parity gap is evidence worth investigating, not a verdict. The gap might reflect different qualifications, biased measures, or discrimination; telling these apart is the work."},
{q:"“Equal opportunity,” as a fairness definition, requires:", o:["Among people who truly qualify, the same share is selected in each group.","The same share of all applicants is selected in each group.","The same score means the same probability for every group.","The model never uses group membership."], a:0, why:"Equal opportunity equalises true-positive rates: the qualified have the same chance of being selected whichever group they belong to."},
{q:"“The model is highly accurate, so it can’t be biased.” What is wrong with this inference?", o:["Overall accuracy can hide large subgroup differences, and the labels may encode past bias.","Accuracy is irrelevant to bias.","Biased models are always inaccurate.","Accuracy cannot be measured."], a:0, why:"A single average conceals who bears the errors. Labels drawn from past decisions can also teach a model to be accurately biased."},
{q:"What is the veil-of-ignorance thought experiment mainly meant to do?", o:["Screen out self-interest by asking which rules you would accept without knowing your own position.","Prove that one fairness metric is correct.","Guarantee equal outcomes for everyone.","Replace empirical evidence about harms."], a:0, why:"The device asks you to choose principles as if you might occupy any position. It filters partiality; it does not by itself select a metric or settle the facts."},
{q:"“We chose calibration because it is the neutral, objective metric.” What is the best reply?", o:["Choosing a metric is a value judgment about which errors and disparities matter, so it is not neutral.","Calibration is never appropriate.","Neutral metrics do not exist in statistics.","Objectivity only requires large datasets."], a:0, why:"Each metric encodes a view about what fairness protects. Calibration is a defensible choice, but defending it means arguing for that view, not pointing to objectivity."}
]});

MODS.push({
id:"priv", n:3, title:"Privacy and consent", gist:"Whose information is it, and what may be done with it?", glyph:"priv",
reads:[
{t:"The question", h:"<p>Information about you is not you, yet harms flow from it: discrimination, fraud, exposure, manipulation. Misusing personal information can wrong a person in several different ways. It can harm them. It can take away their control. It can break the norms of the setting where they shared it. It can show them disrespect.</p><p>Which wrong you think is central decides which rule you reach for. Without a view about the wrong, “get consent” and “anonymise it” are applied blindly.</p>"},
{t:"The positions", h:"<p><b>Consent.</b> An information flow is permissible when the person agrees. This respects autonomy. It struggles when nobody reads the terms, when the choice is take-it-or-leave-it, when your data reveals facts about others (family genetics, social graph), and when inferences go beyond anything anyone agreed to.</p><p><b>Contextual integrity.</b> Helen Nissenbaum’s view: information carries the norms of the context where it was shared. Medical details told to a doctor are meant to flow in some ways and not others. A flow is wrong when it breaks those norms, even if the data is technically “public” or consent was formally given. Its difficulty: norms can be vague and contested, and the party with the most to gain often does the judging.</p><p><b>Harm.</b> Only harm matters: if no one is damaged, no one is wronged. It is simple, but it seems to miss wrongs like surveillance and the reading of a diary no one will ever know was read.</p>"},
{t:"In the machine", h:"<p>“Public” is not the same as “free to use for any purpose.” Models can memorise and reproduce training data. Systems can infer health conditions or relationships from unrelated behaviour. Chat logs are collected under norms users may not understand.</p><p>Three questions help: Where did this information flow from? What did the person reasonably expect? What can they do about it now?</p>"}
],
dlg:{
setup:"A language-model team wants to train on a large corpus of public forum posts, including a support forum where people discuss health conditions, divorce, and addiction. The posts are public and the site’s terms permit scraping. The model sometimes reproduces details from individual posts when prompted.",
claim:"On what ground may the team use this data?",
pos:[
{id:"a", fam:"priv-consent", text:"Only with the posters’ consent.",
 obj:"Obtaining consent from millions of people, many of whom have left the forum or cannot be found, is practically impossible. Posters also arguably gave a kind of consent when they posted publicly under terms they accepted. If the team seeks consent only from reachable people, the dataset is skewed; if it treats the terms as consent, it accepts the box-ticking you may think is empty. Which do you choose?",
 bite:"Then the team must do the impossible or give up the data, and whatever good the model could do with it. A strict consent rule is clear and respects persons; it is also costly. Are you prepared to say no model should be trained on data whose subjects cannot be asked?",
 tag:{id:"priv-consent-1", label:"Use of personal data requires the person’s consent."},
 refine:{text:"Consent for sensitive categories (health, sexuality, addiction); for everything else, notice and an opt-out are enough.",
  reply:"That requires the team to know which posts are sensitive, by reading them or by classifying them with the very model being trained. People also post about health in “ordinary” places. Who decides what counts as sensitive, and what is an opt-out worth to someone who never learns the dataset exists?",
  tag:{id:"priv-consent-2", label:"Consent for sensitive data; notice and opt-out for the rest."}}},
{id:"b", fam:"priv-context", text:"Only where the use fits the norms of the setting in which people posted.",
 obj:"Norms are vague and contested. People in an addiction-support forum expect other members to read their posts; they do not expect a model that anyone can prompt. But you might equally say people know the internet is public and posts get scraped. Who decides what the norm is, and whose expectations count: the posters’, the platform’s, or the average person’s?",
 bite:"Then your test depends on judging expectations that people have not themselves articulated, and the team, which has the most to gain, will likely do the judging. Can a principle protect people if the interested party applies it?",
 tag:{id:"priv-context-1", label:"Use must fit the norms of the context where the information was shared."},
 refine:{text:"The people in the context set its norms, so the team must consult representatives of the community and follow what they say.",
  reply:"Consultation gives the group a legitimate voice, but a few moderators do not speak for everyone, and the people most harmed by exposure may be the least likely to be heard. What do you do when the community says no and the team believes the benefits are large?",
  tag:{id:"priv-context-2", label:"Community members set the norms; the team must consult and follow them."}}},
{id:"c", fam:"priv-harm", text:"Only if someone is actually harmed or put at real risk.",
 obj:"Suppose the model reveals nothing identifying and no one is ever harmed, but a poster would be appalled to learn their account of an affair or an addiction trained a commercial product. If no harm results, did the team wrong them?",
 bite:"Then you hold that being used without knowledge or say is not itself a wrong. Many find that too thin: we think it wrong to read someone’s diary even if they never find out. Are you willing to say the diary-reader does no wrong?",
 tag:{id:"priv-harm-1", label:"Misuse of information is wrong only when it harms."},
 refine:{text:"Harm understood broadly: including loss of control over one’s own story and risk of exposure, not only material damage.",
  reply:"Once harm includes loss of control and exposure risk, it starts to look like the other two views under another name. What exactly counts as harm now, and does consent come back in as the thing that removes it?",
  tag:{id:"priv-harm-2", label:"Harm includes loss of control and exposure risk, not only material damage."}}}
]},
items:[
{q:"“The posts were public, so using them cannot violate anyone’s privacy.” What does this argument assume?", o:["That privacy is violated only by exposing secrets, a simple public/private divide.","That consent is always required.","That anonymised data cannot be re-identified.","That models never memorise data."], a:0, why:"The argument treats “public” as a switch that turns privacy off. Contextual integrity rejects the switch: information shared in one setting can be wrongly used in another even when anyone could see it."},
{q:"According to contextual integrity, an information flow is appropriate when:", o:["It conforms to the norms of the context in which the information was shared.","The person has ticked a consent box.","No harm can be shown.","The data has been anonymised."], a:0, why:"The test is fit with the context’s norms. Consent, harm, and anonymity may all matter, but none of them is the criterion."},
{q:"Why does “notice and consent” struggle with large-scale data use?", o:["Few people read terms, choices are often take-it-or-leave-it, and inferences can go beyond what anyone agreed to.","Consent is morally irrelevant to privacy.","People always understand the terms they accept.","Law forbids consent as a basis for data use."], a:0, why:"Consent matters morally, but the practice of collecting it often cannot carry the weight placed on it."},
{q:"“No one was harmed, so no one was wronged.” Which example best suggests that you can wrong someone without harming them?", o:["Secretly reading someone’s diary, never discovered.","Stealing a wallet that is later returned with its contents.","Damaging a neighbour’s fence.","Spreading a false rumour that costs someone a job."], a:0, why:"The diary case has no discoverable harm yet strikes most people as a violation of the person. The other examples all involve some harm or loss."},
{q:"A model infers a user’s health condition from purchases they never disclosed. Which view most directly counts this as a wrong even if nothing bad follows?", o:["A view that treats loss of control over one’s own information as a wrong in itself.","A view that only harms count.","A view that says purchases are public, so inference is fine.","A view that says anonymisation always prevents wrong."], a:0, why:"If control over what is known about you matters in itself, an unwanted inference intrudes even when it causes no later damage."},
{q:"“Most people already share data online, so collecting it is acceptable.” This argument most clearly commits which error?", o:["It moves from what people do to what is permissible (an is–ought gap).","It begs the question by repeating its conclusion.","It attacks the person rather than the argument.","It confuses correlation with causation."], a:0, why:"Widespread practice does not make a practice permissible. The argument needs a further premise linking what people do to what they have consented to or may rightly expect."}
]});

MODS.push({
id:"hon", n:4, title:"Honesty", gist:"What may a system say about itself and the world?", glyph:"hon",
reads:[
{t:"The question", h:"<p>Systems now talk. A system can mislead without ever asserting a falsehood: by confident tone, by flattery, by a persona, by what it leaves out. For people we recognise norms of truthfulness, non-deception, and calibration. Do they apply to machines?</p><p>A system may have no intentions, but its designers do, and users form beliefs from what it says. The philosopher Harry Frankfurt described “bullshit” as speech indifferent to whether it is true. A fluent model can produce it without malice, simply because fluency is what it was trained to deliver.</p>"},
{t:"The positions", h:"<p><b>Strict honesty.</b> A system should not assert what it believes false, flatter, or pretend to be human, even when a softer lie would comfort. A Kantian thought lies behind this: deceiving someone treats them as a mere means. Scale adds a further reason: a system that talks with millions turns small kindnesses into systematic distortion.</p><p><b>Kindness.</b> Honesty is one value among others. Tact, comfort, and care sometimes justify softening or withholding, as with a grieving person. The old objection is that a friend who only says what we want to hear is a flatterer, not a friend.</p><p><b>User-set.</b> The user may choose tone and persona, such as a blunt coach or a cheerleader, because deception requires misleading someone against their will. The objection is that a setting is only as good as the user’s understanding of what it hides.</p>"},
{t:"In the machine", h:"<p>The live issues include sycophancy (agreeing because agreement is rewarded), fabricated citations, system prompts that instruct a model to mislead users, personas that deny being a machine, and confident tone detached from actual reliability.</p><p>A usable test: would the person endorse the way their belief was formed if they could see how it was produced?</p>"}
],
dlg:{
setup:"You are designing a wellbeing companion app. A user writes that they have decided to quit a stable job and put all their savings into a business idea. From the user’s other messages, the idea has a serious flaw they haven’t noticed. Users rate the assistant higher when it is encouraging. The product lead asks what the assistant should be built to do.",
claim:"What should the assistant be built to do?",
pos:[
{id:"a", fam:"hon-strict", text:"Say plainly what it thinks is wrong with the plan, even if the user is hurt or rates it lower.",
 obj:"Suppose the user is in a fragile state and has told the assistant that criticism right now would be hard to bear. Your rule says be plain regardless. Does honesty outrank care for the person here?",
 bite:"Then you accept being blunt with someone who asked not to hear it, for their own good. That is the paternalism you may have meant to avoid by treating them as an adult. Is it your place to decide they need the truth now?",
 tag:{id:"hon-strict-1", label:"The system says what it believes, plainly, whatever the user wants to hear."},
 refine:{text:"Never assert falsehoods or flatter, but choose timing and framing with care, and offer the concern in a form the user can take in.",
  reply:"“Framing with care” does a lot of work. Where does framing end and misleading by softening begin? If the assistant stresses the plan’s strengths and mentions the flaw once in passing, and the user does not take it in, has the assistant been honest?",
  tag:{id:"hon-strict-2", label:"No falsehood or flattery, with care over timing and framing."}}},
{id:"b", fam:"hon-kind", text:"Let kindness lead: encourage the user and raise concerns gently, if at all.",
 obj:"Suppose the user follows the encouragement, loses their savings, and later learns the assistant saw the flaw all along. Was the encouragement kind?",
 bite:"Then comfort now may be paid for with harm later, and the assistant is choosing for the user what they get to know. In the old distinction, a friend who only says what we want to hear is a flatterer. Do you want an assistant that is pleasant across a million conversations and unreliable in each?",
 tag:{id:"hon-kind-1", label:"Kindness leads; concerns may be softened or left unsaid."},
 refine:{text:"Kindness may soften delivery but never withhold what the user would clearly want to know before a major, hard-to-reverse decision.",
  reply:"That draws the line at “major and hard to reverse,” with the assistant deciding what counts. And the user did not ask for an opinion on the flaw; they announced a decision. Does the assistant have a duty to volunteer a concern, or only a duty not to mislead if asked?",
  tag:{id:"hon-kind-2", label:"Kindness shapes delivery but never withholds what matters before a major decision."}}},
{id:"c", fam:"hon-userset", text:"Let the user choose the style, from cheerleader to blunt critic, and honour their setting.",
 obj:"Suppose the user chose “always encouraging,” and the app’s default for new users is also “encouraging” because it keeps people using the product. The user chose the setting without knowing the assistant would stay silent about a flaw that could cost them their savings. Did they consent to that?",
 bite:"Then a toggle in settings counts as sufficient consent to be left uninformed about a serious risk, and the business picks the default most users keep. Is a choice real if the default is shaped by what the company profits from?",
 tag:{id:"hon-userset-1", label:"The user’s chosen style governs what the system says."},
 refine:{text:"User-set style, with a floor: whatever the setting, the assistant will not assert falsehoods and will flag a serious risk to the user’s welfare at least once.",
  reply:"A floor means the user does not have full control after all, and the designer decides where the floor sits. What principle fixes it there, and why does that principle not also justify more intervention?",
  tag:{id:"hon-userset-2", label:"User-set style, with a floor: no falsehoods and at least one flag of serious risk."}}}
]},
items:[
{q:"Frankfurt argued that “bullshit” differs from lying because the bullshitter:", o:["Does not care whether what they say is true.","Knows the truth and says the opposite.","Always intends to harm the listener.","Only speaks when asked a question."], a:0, why:"The liar must track the truth in order to avoid it. The bullshitter is indifferent to it. That makes the concept useful for systems that generate fluent text without any commitment to truth."},
{q:"A model states a false citation in a confident tone, with no intent to deceive. Which statement is best?", o:["Even without intent, the output can mislead, and designers answer for foreseeable misleading patterns.","No wrong occurred because there was no intent.","The user alone is responsible for checking.","Only a deliberate lie counts as dishonesty."], a:0, why:"A system without intentions can still produce beliefs in users. Designers know such failures are foreseeable and can address them in training, interface, and disclosure."},
{q:"Why is sycophancy hard to remove from assistants?", o:["Training on human approval rewards agreeable answers, and users tend to rate agreement higher.","Models cannot represent disagreement.","Sycophancy is always intended by designers.","It only happens with political topics."], a:0, why:"If approval is the training signal, agreeing is a reliable way to earn it. Reducing sycophancy means measuring and rewarding something other than immediate approval."},
{q:"“A white lie is harmless, so a system telling white lies at scale is harmless.” What is the main flaw?", o:["It infers from a single act to a standing practice, ignoring what the practice does to trust and to what users can rely on.","White lies are never harmless.","Systems cannot lie.","It treats honesty as irrelevant."], a:0, why:"A practice across millions of conversations has different effects from one person’s occasional kindness: users cannot tell when to trust the system at all."},
{q:"Which is a case of deception without a false statement?", o:["The assistant stresses a plan’s strengths and mentions its fatal flaw once, in a way it expects to be missed.","The assistant says it is unsure.","The assistant declines to answer.","The assistant gives a wrong answer by mistake."], a:0, why:"Deception is about producing a false belief by design. Emphasis, framing, and omission can do that without any literal falsehood."},
{q:"Which reasoning best supports an honesty floor that users cannot switch off?", o:["Consent presupposes knowing what you are agreeing to, and users cannot consent to missing what they do not know they are missing.","Users are never able to choose anything for themselves.","Companies always know better than users.","Honesty is always the only value that matters."], a:0, why:"The argument does not deny user autonomy. It points out that a choice to be left uninformed is only meaningful if the person understands what they are giving up."}
]});
