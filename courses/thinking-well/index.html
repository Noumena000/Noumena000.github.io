<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thinking Well with AI: a critical thinking course for everyone</title>
<meta name="description" content="A self-paced, interactive critical thinking course on judging claims, evidence, and AI answers. Eight short sessions, practice, dialogue, and a capstone. No account needed.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCFCFA">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#FCFCFA; --surface:#F1F0EB; --ink:#000; --muted:#5E5E58; --rule:#D6D5CF;
  --red:#C33A22; --yellow:#E3AE1C; --blue:#1D5A9E; --focus:#1D5A9E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
    --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
  --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  font-size:18px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
main{max-width:680px; margin:0 auto; padding:40px 22px 96px}
main:focus{outline:none}
h1,h2,h3{font-weight:400; line-height:1.15; margin:0}
p{margin:0 0 .9em}
a{color:var(--blue)}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:15px; line-height:1.5}

/* Hero */
.hero{padding:24px 0 36px; border-bottom:1px solid var(--rule); margin-bottom:36px}
.hero h1{font-size:clamp(42px,10.5vw,78px); letter-spacing:-.02em; margin:14px 0 12px}
.hero .lede{font-size:21px; font-style:italic; max-width:30em; margin:0 0 22px}
.trio{display:block}
.next{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin:0 0 44px}
.next p{margin:0; flex:1 1 260px}

/* Buttons */
.btn{
  appearance:none; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:10px 20px; border-radius:2px; cursor:pointer; font-size:17px; line-height:1.3;
}
.btn:hover{background:var(--blue); border-color:var(--blue)}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover{background:var(--surface); color:var(--ink); border-color:var(--ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--blue); padding:10px 6px; text-decoration:underline; text-underline-offset:3px}
.btn.quiet:hover{background:transparent; color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:default}

/* Sections */
.sec{margin:0 0 48px}
.sec h2{font-size:30px; margin-bottom:6px}
.sec > .muted{margin-bottom:18px}

/* The path */
.books{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.books li{border-bottom:1px solid var(--rule)}
.book{
  display:grid; grid-template-columns:44px 1fr auto; gap:16px; align-items:center;
  width:100%; text-align:left; background:none; border:0; padding:16px 4px; cursor:pointer;
}
.book:hover{background:var(--surface)}
.book .num{font-size:14px; color:var(--muted); display:block}
.book .title{font-size:21px; display:block; line-height:1.25}
.book .gist{font-size:15px; color:var(--muted); display:block; line-height:1.45; margin-top:2px}
.state{font-size:14px; color:var(--muted); text-align:right; max-width:11em}
.state.done{color:var(--blue); font-style:italic}
.dots{display:inline-flex; gap:3px; margin-top:4px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--rule); display:block}
.dots i.y{background:var(--blue)} .dots i.n{background:var(--red)}

/* Reading */
.back{margin:0 0 20px}
.unit-head{display:flex; gap:18px; align-items:flex-start; margin-bottom:22px}
.unit-head h1{font-size:clamp(32px,7.5vw,48px); letter-spacing:-.01em}
.unit-head .num{color:var(--muted); font-size:16px}
.unit-head .gist{font-style:italic; margin:6px 0 0}
.parts{display:flex; gap:6px 14px; flex-wrap:wrap; margin:0 0 30px; font-size:14px; color:var(--muted)}
.parts span.ok{color:var(--blue)}
.parts span.ok::before{content:"✓ "}
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer; padding:14px 0; font-size:20px; list-style:none; display:flex; justify-content:space-between; align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--muted); font-size:22px}
details[open] summary::after{content:"−"}
.reading{padding:0 0 18px}
.ex{background:var(--surface); padding:12px 16px; margin:4px 0 14px; border-left:3px solid var(--blue)}
.ex p:last-child,.reading p:last-child{margin-bottom:0}

/* Case, lab, dialogue, practice */
.part{font-size:19px; color:var(--muted); margin:26px 0 10px}
.kase,.lab,.dlg,.practice,.reflect,.coachsec{margin-top:44px}
.kase h2,.lab h2,.dlg h2,.practice h2,.reflect h2,.coachsec h2{font-size:28px; margin-bottom:6px}
.scene{background:var(--surface); border-left:3px solid var(--yellow); padding:14px 18px 6px; margin:14px 0 22px}
.scene .muted{margin-bottom:6px}
.turn{margin:0 0 16px; padding:2px 0 2px 16px; border-left:3px solid var(--rule); white-space:pre-wrap}
.turn p{margin:0}
.turn.q{border-left-color:var(--red)}
.turn.you{border-left-color:var(--blue)}
.turn.note{border-left-color:var(--yellow); color:var(--muted); font-style:italic}
.who{display:block; font-size:14px; color:var(--muted); font-style:normal}
.opt{
  display:block; width:100%; text-align:left; padding:12px 14px; margin:0 0 10px; cursor:pointer;
  border:1.5px solid var(--ink); background:var(--paper); border-radius:2px; line-height:1.45;
}
.opt:hover{background:var(--surface)}
.opt[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.opt.right{border-color:var(--blue); background:var(--surface); color:var(--ink)}
.opt.wrong{border-color:var(--red); color:var(--ink)}
.opt.missed{border-style:dashed; border-color:var(--blue); color:var(--ink)}
.opt[disabled]{cursor:default; opacity:1}
.opt .tag{display:block; font-size:14px; color:var(--muted); margin-top:4px; font-style:italic}
label.fl{display:block; margin:18px 0 4px; font-size:16px}
textarea.write{
  width:100%; min-height:96px; font-family:inherit; font-size:17px; line-height:1.5; padding:10px 12px;
  border:1.5px solid var(--ink); background:var(--paper); border-radius:2px; margin:0 0 8px; resize:vertical;
}
.err{color:var(--red); font-size:15px; margin-top:8px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.reply{border-left:3px solid var(--yellow); padding:2px 0 2px 16px; margin:12px 0 4px}
.reply p{margin:0}

/* Labs */
.sent{border-top:1px solid var(--rule); padding:14px 0 6px}
.sent:last-child{border-bottom:1px solid var(--rule)}
.sent > p{margin:0 0 10px}
.cats{display:flex; gap:8px; flex-wrap:wrap}
.cats .opt{display:inline-block; width:auto; margin:0; padding:7px 12px; font-size:16px}
.fb{margin:10px 0 8px; font-size:16px; line-height:1.5}
.fb b{font-weight:700}
.fb.ok b{color:var(--blue)} .fb.bad b{color:var(--red)}
.grp{font-size:19px; margin:26px 0 4px}
.slider{margin:16px 0}
.slider label{display:flex; justify-content:space-between; gap:12px; font-size:16px; margin-bottom:4px}
.slider input[type=range]{width:100%; accent-color:var(--blue)}
.grid1000{display:grid; grid-template-columns:repeat(40,1fr); gap:2px; margin:16px 0 8px}
.grid1000 i{aspect-ratio:1; border-radius:50%; background:var(--rule); display:block}
.grid1000 i.tp{background:var(--blue)} .grid1000 i.fp{background:var(--red)} .grid1000 i.fn{background:var(--yellow)}
.key{display:flex; gap:6px 16px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-bottom:12px}
.key i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:baseline}
.result{border:1.5px solid var(--ink); padding:14px 16px; margin:14px 0}
.result .big{font-size:32px; line-height:1.1; margin:0 0 4px}
.bar{height:14px; background:var(--rule); position:relative; margin:14px 0 6px}
.bar i{position:absolute; top:0; bottom:0; background:var(--blue); opacity:.4}
.bar b{position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--ink)}
.cols2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0}
.box{border:1.5px solid var(--ink); padding:14px 16px 6px}
.box h3{font-size:19px; margin-bottom:8px}
.box.steady{border-color:var(--blue)}
.box.agree{border-color:var(--red)}

/* Practice */
.practice-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.prop{border:1.5px solid var(--ink); padding:26px 24px 22px; margin-top:12px}
.prop .label{font-size:14px; color:var(--muted); margin-bottom:10px}
.qt{font-size:22px; line-height:1.45; margin:0 0 20px}
.feedback{margin-top:16px; min-height:1px}
.verdict{font-size:21px; margin:0 0 6px}
.verdict.ok{color:var(--blue)} .verdict.bad{color:var(--red)}

/* Check, capstone, record */
.meter{height:6px; background:var(--rule); margin:0 0 18px}
.meter i{display:block; height:100%; background:var(--blue)}
.skill{display:grid; grid-template-columns:1.6em 1fr; gap:0 8px; padding:10px 0; border-top:1px solid var(--rule)}
.skill:last-child{border-bottom:1px solid var(--rule)}
.skill .mk{color:var(--blue)} .skill .mk.no{color:var(--red)}
.skill p{margin:0 0 4px}
.checks label{display:flex; gap:10px; align-items:flex-start; margin:0 0 10px; font-size:17px}
.checks input{margin-top:.45em; accent-color:var(--blue)}
.commit{border-top:1px solid var(--rule); padding:14px 0}
.commit:last-child{border-bottom:1px solid var(--rule)}
.commit h3{font-size:20px; margin-bottom:4px}
.commit .lab{font-size:15px; color:var(--muted)}
.coach{border:1.5px dashed var(--muted); padding:18px 18px 14px; margin-top:14px}
.coach .turn.q{border-left-color:var(--yellow)}
.coach textarea.write{min-height:72px}
textarea.json{width:100%; min-height:150px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; padding:10px; border:1.5px solid var(--rule); background:var(--surface); border-radius:2px; margin:10px 0}
.sync{font-size:14px; color:var(--muted); margin-top:12px}
.foot{margin-top:64px; padding-top:18px; border-top:1px solid var(--rule); font-size:15px; color:var(--muted)}
.foot p{margin:0 0 .6em}

@media (max-width:520px){
  body{font-size:17px}
  main{padding:28px 18px 80px}
  .book{grid-template-columns:36px 1fr}
  .book .state{grid-column:2; text-align:left; max-width:none}
  .prop{padding:20px 16px 18px}
  .cols2{grid-template-columns:1fr}
  .grid1000{grid-template-columns:repeat(25,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .5s ease-out}
  @keyframes flash{from{background:var(--surface)} to{background:transparent}}
}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>

<script>
"use strict";
/* ===== Course content, part 1: modules 1-3 =====
   Item convention: o[0] is always the correct option; the page shuffles at display time.
   Examples marked "invented" are made up for teaching and do not describe real studies. */
const MODS=[];

MODS.push({
id:"claims", n:1, title:"Claims and support", gist:"What exactly is being said, and what backs it up?", glyph:"claims",
kase:{
 h:"<p>An advert for a supplement says: “Doctors recommend it, and it’s all natural.”</p><p>A friend reads it and says, “Well, that settles it. It must work.”</p>",
 ask:"What is the first thing you would want to know?",
 opts:[
  {t:"Which doctors, how many, and recommending it for what?", r:"A good start. You are asking what is behind the words. “Doctors recommend it” could mean a handful of paid spokespeople or a large independent review, and the sentence sounds the same either way."},
  {t:"Whether “natural” means safe or effective.", r:"Also a good question. Many natural things are harmless and some are dangerous. The word is doing persuading, not proving. This module is about telling those two jobs apart."},
  {t:"Whether the claim is even about working.", r:"Sharp. The advert never says what “it” is supposed to do. A claim that is vague about its own conclusion is hard to test, which is sometimes the point."},
  {t:"Nothing. It sounds fine to me.", r:"Many of us start there, and it is a normal reaction to confident wording. The course is about slowing down just enough to ask what is behind it."}
 ]},
reads:[
 {t:"The idea", h:"<p>A <b>claim</b> says that something is so. <b>Support</b> is a reason to believe it. Most of what we read mixes the two, and also adds a third thing: words that sound like support but are not.</p><p>Start by finding the <b>conclusion</b>: the thing the writer wants you to accept. Then take each reason in turn and ask one question: <i>if this part were true, would I have more reason to believe the conclusion?</i> If not, it is decoration.</p><p>Common decoration includes popularity (“everyone is buying it”), vague authority (“experts agree”, “studies show”), calling something natural or traditional, a confident tone, and emotional language. None of these is automatically false. They just do not bear on the conclusion.</p>"},
 {t:"A worked example", h:"<div class=\"ex\"><p>“Our app is the safest on the market. It is also the most popular, and our CEO says it is extremely secure.”</p></div><p><b>Conclusion:</b> the app is the safest.</p><p><b>Popularity:</b> shows many people use it. It does not show it is safe. Popular things can be unsafe.</p><p><b>The CEO’s word:</b> a statement from someone with an interest in the answer. It is another claim, not evidence for the first one.</p><p>So the passage contains a conclusion and no support. That does <i>not</i> mean the app is unsafe. It means this passage gives you no reason to think it is safe.</p>"},
 {t:"The AI twist", h:"<p>A chatbot can write a smooth, well-organised paragraph that has the <i>shape</i> of an argument: a point, some reasons, a firm ending. Polish makes it feel supported.</p><p>But fluency is cheap for a machine. A paragraph can contain a claim and no support at all, in the same way the advert did. Strip away the polish and ask: what exactly is being claimed, and what does each sentence point to that I could check?</p><p>This does not mean AI answers are usually wrong. Often they are right. The point is that how an answer <i>reads</i> tells you little about whether it is backed up.</p>"}
],
lab:{type:"classify", title:"Sort the sentences",
 intro:"Tap a label for each sentence. You will get a short note after each choice.",
 cats:["The conclusion","Checkable support","Not support as written"],
 groups:[
  {title:"An AI answer", items:[
   {t:"Intermittent fasting is the best way to lose weight.", a:0, note:"This is what the answer wants you to accept."},
   {t:"Studies show it works for most people.", a:2, note:"It points toward evidence without giving any: no study, no number, no group of people. It might be true, but as written you cannot check it."},
   {t:"It is a natural approach.", a:2, note:"Natural things can be harmful or useless, so this does not bear on whether it works."}
  ]},
  {title:"An advert (invented example)", items:[
   {t:"Brightpath is the fastest way to learn Spanish.", a:0, note:"The claim the whole advert is built to support."},
   {t:"More than five million people have downloaded it.", a:2, note:"Popularity shows many people tried it, not that it is fastest."},
   {t:"In a 2023 university trial of 200 beginners, Brightpath users scored higher after eight weeks than a group using a textbook.", a:1, note:"This can be checked, and it bears on the claim. But it compares with one textbook, so it supports “better than a textbook” more than “fastest”."},
   {t:"It is fun and easy to use.", a:2, note:"Pleasant to use, but nothing here is about how fast people learn."},
   {t:"Our founder says it changed her life.", a:2, note:"A personal story is one person’s report, not a test."}
  ]}
 ]},
items:[
 {q:"“This is the best phone, because it’s the one everyone is buying.” What is the conclusion, and what support is offered?", o:["Conclusion: it is the best phone. Support: popularity, which does not show it is best.","Conclusion: everyone is buying it. Support: it is the best phone, which explains why.","There is no conclusion here, only a description of what people are buying right now.","Conclusion: it is the best phone. Support: strong sales figures that prove its quality."], why:"The writer wants you to accept that the phone is best. Popularity is the only reason given, and many people can buy a thing for reasons unrelated to quality: price, habit, advertising."},
 {q:"Which added sentence would count as evidence for “The bakery on Elm Street is the best in town”?", o:["In the town fair taste test, outside judges ranked its bread first out of twelve bakeries.","My whole family has bought bread from there every week for fifteen years and agrees.","The owner is a respected local figure who has run the bakery for forty years and is very kind.","Its sign and its delivery van are seen on nearly every street, so most people know the name."], why:"The taste test can be checked, was run by people with no stake, and compares the bakery with others. The other sentences are about agreement, kindness, or visibility, none of which show the bread is better."},
 {q:"“You should take the highway, because it is faster, and highways are modern.” Which part could you remove without weakening the case?", o:["“Highways are modern.” Removing it changes nothing about the reasons to take the highway.","“It is faster.” Removing it still leaves a reason to prefer the highway over other roads.","“You should take the highway.” The case works as well with only the two reasons.","Nothing can be removed, because each part adds a little to the overall impression."], why:"“Faster” is a reason to choose a route. “Modern” is decoration: it does not make the trip shorter. Removing it leaves the case exactly as strong."},
 {q:"An AI answer says: “Walking 10,000 steps a day is essential for good health. Experts agree, and it is widely known.” What is the main weakness?", o:["It gives no checkable support: “experts agree” names no one and “widely known” is only popularity.","It is almost certainly false, because the number of steps is too round to be based on research.","It is too short to count as an answer, since a real answer would cite at least three studies.","It is fine, because it says experts agree and advice about walking is common knowledge."], why:"The weakness is missing support, not proven falsity. The claim might still be right or wrong. The useful move is to ask what it rests on and look for the actual evidence."},
 {q:"A chatbot writes four polished paragraphs and ends: “Therefore, your product launch failed because of poor timing.” You gave it no sales data. What is the best reading?", o:["A plausible story. With no data about your launch, the conclusion is a guess, however polished.","A reasoned conclusion, because four paragraphs would not be written without some underlying analysis.","A reliable finding, since the word “therefore” shows the conclusion follows from the earlier points.","An informed verdict, because the chatbot has seen many launches and knows how they usually fail."], why:"Length and a confident “therefore” are not evidence. If it was given nothing about your launch, it can offer possible explanations but cannot know which one is true."},
 {q:"You ask a chatbot for evidence for a claim. It replies with a confident paragraph that says the same thing in new words. Did you get support?", o:["No. Restating a claim is not support. Ask what it rests on and how you could check.","Yes. A second explanation in new words gives the claim twice as much support as before.","Yes, because it answered confidently and directly when you asked for evidence.","No, because chatbots are unable to provide evidence, so asking is pointless."], why:"Saying a thing twice is not a reason to believe it. You can ask for a named source, a specific number, or the reasoning step by step, and then check what you get. “Never” goes too far: sometimes the support is real."}
],
dlg:{
 setup:"A friend sends you an AI answer: “Standing desks improve productivity. Many studies show it, and offices that adopt them see happier teams.” You manage a team and are deciding whether to buy twenty desks.",
 steps:[
  {ask:"What would you do first to test this answer?", opts:[
   {t:"Ask which studies it means, then look at what they actually measured.", r:"That is checking the support, not the style. Suppose the study measured how much people liked their desks, not how much work got done. Would it still back “improve productivity”?"},
   {t:"Ask the AI whether it is sure.", r:"If the first answer was wrong, “are you sure?” can produce the same claim in firmer words. What could you ask that might reveal something new?"},
   {t:"Buy two or three and see what happens on my team.", r:"A small trial on your own team is a real test of the claim for your situation. What would you measure, and for how long, so that you would know if it worked?"}
  ]},
  {ask:"Say you find one real study. It surveyed forty office workers for two weeks and found they reported feeling more energetic. What does it support?", opts:[
   {t:"That standing desks improve productivity.", r:"Feeling energetic is not the same as getting more done, and two weeks with forty people is a small window. Support comes in degrees: this gives some reason, but not much for the big claim."},
   {t:"Something narrower: some workers felt more energetic over a short time.", r:"Yes. Support reaches only as far as what was measured. Notice how much smaller this is than the original claim."},
   {t:"Nothing. One small study is useless.", r:"Small studies are weak, not worthless. “Nothing” is as hasty as “proven”. What size of belief does a small, short study deserve?"}
  ]},
  {ask:"So what is the AI’s claim worth right now?", opts:[
   {t:"Enough to justify a trial, not a purchase for everyone.", r:"That matches the evidence you have: a reason to try, not a reason to commit. You have matched your action to your support."},
   {t:"Probably true. The AI sounded sure.", r:"Sounding sure is part of the style, not the evidence. Everything you actually found is much smaller than the claim."},
   {t:"False until someone proves it.", r:"“Not shown” is not the same as “false”. The careful position is: unsupported so far, and testable."}
  ]}
 ],
 close:"What this showed: a claim is worth what its support is worth. Finding the conclusion, asking what each reason points to, and noticing the gap between the size of the claim and the size of the evidence will carry you a long way, with a person or a chatbot."},
reflect:"If someone doubted your conclusion, what is the first reason you would give them, and would that reason convince a stranger? Write one sentence about how you will check support from now on."
});

MODS.push({
id:"assume", n:2, title:"Hidden assumptions", gist:"What is this taking for granted?", glyph:"assume",
kase:{
 h:"<p>You text a friend and they have not replied in two days. Another friend says: “He hasn’t replied, so he must be angry with you.”</p>",
 ask:"What is that conclusion taking for granted?",
 opts:[
  {t:"That silence means anger, rather than being busy or losing a phone.", r:"Exactly. The reason (no reply) only leads to the conclusion (anger) if you add a step nobody said out loud. That unspoken step is the hidden assumption."},
  {t:"That people always reply quickly unless something is wrong.", r:"Good. That is another way to state the same missing step. It sounds reasonable until you list the ordinary reasons people go quiet."},
  {t:"Nothing. It is just common sense.", r:"Common sense is often a bundle of assumptions we have stopped noticing. Try writing the missing step in a sentence and ask whether it is always true."}
 ]},
reads:[
 {t:"The idea", h:"<p>Most arguments skip a step. They state a reason and a conclusion and leave out the <b>bridge</b> between them. That bridge is a <b>hidden premise</b>: something that must be true for the stated reason to lead to the conclusion.</p><p>To find it, write the reason, write the conclusion, and ask: <i>what would have to be true for this reason to lead there?</i> Then ask whether the bridge is true. A weak bridge is where many bad arguments break.</p><p>Be fair when you do this. State the <b>most reasonable</b> bridge, not the silliest one. If the argument only works with an absurd premise, say so, but first check that you have not made the author sound worse than they are.</p>"},
 {t:"A worked example", h:"<div class=\"ex\"><p>“That restaurant is empty, so the food must be bad.”</p></div><p><b>Reason:</b> the restaurant is empty. <b>Conclusion:</b> the food is bad.</p><p><b>The bridge:</b> “Restaurants with good food are never empty.” That is false: a new place, an odd hour, or a poor location can empty a good restaurant.</p><p><b>A fairer bridge:</b> “Good restaurants usually attract customers.” That is more reasonable, but notice what happens to the conclusion. It can only become “the food might be bad”, not “must be”.</p><p>Questions can hide assumptions too. “When did you stop cheating on exams?” is a question that cannot be answered without accepting that you cheated.</p>"},
 {t:"The AI twist", h:"<p>The way you phrase a question can build in the answer. “Why is remote work less productive?” assumes it <i>is</i> less productive. Models often answer inside the frame they are handed. They will give you reasons, because you asked for reasons, without stopping to say that the premise is in doubt.</p><p>Two habits help. First, check your own question before you send it: what does it assume? Second, ask in a neutral way, such as “What does the evidence say about productivity in remote and in-office work?”</p><p>You can also ask a model to list the assumptions in a question. That can help, but treat the list as a starting point: it may miss the assumption that matters most.</p>"}
],
lab:{type:"pick", title:"Find the missing steps",
 intro:"Choose every statement that the argument quietly needs, then check your picks.",
 prompt:"“The new bus route lost money last year, so we should cancel it.” Which of these is an unstated assumption the conclusion needs?",
 opts:[
  {t:"The goal of a bus route is to make money.", yes:true, why:"Many public services are meant to serve people and are expected to lose money. If that is the goal here, a loss alone is no reason to cancel."},
  {t:"Cancelling it would not cost more than it saves.", yes:true, why:"If cancelling leaves empty buses to sell or contracts to pay, the saving may be smaller than it looks."},
  {t:"Nothing else, such as a new timetable, could fix the losses.", yes:true, why:"The argument jumps from “losing money” to “cancel”, skipping other ways to respond."},
  {t:"Last year was typical of what will happen in future years.", yes:true, why:"A one-year loss could be a poor start or an unusual year."},
  {t:"The route lost money last year.", yes:false, why:"This is stated outright, so it is not hidden."},
  {t:"Buses are an important form of transport.", yes:false, why:"The argument does not need this. If anything, it points the other way."}
 ]},
items:[
 {q:"“Ana is always late, so she doesn’t respect us.” Which hidden premise does this need?", o:["That lateness comes from disrespect rather than things like a long commute.","That Ana has arrived late on more than one occasion, which is stated in the sentence.","That punctuality is valued highly in many workplaces and in many countries around the world.","That Ana is a good person who would normally want to respect her colleagues."], why:"The stated reason is lateness. For it to lead to “doesn’t respect us”, you need the bridge that lateness is caused by disrespect. Ana’s lateness is already stated, so it is not hidden."},
 {q:"“When did you stop cheating on your exams?” What is wrong with this question?", o:["It assumes you cheated, so any direct answer would accept that claim.","It asks about timing only, which makes it a harmless question about your history.","It is too brief to answer fairly, since a full reply would need more detail.","It is a fair question, as it only asks when something happened and nothing more."], why:"A loaded question hides a claim inside it. The honest reply is to challenge the assumption: “I haven’t cheated.”"},
 {q:"“All the best runners train at dawn. If you want to be great, train at dawn.” Which hidden premise matters most?", o:["That dawn training is what makes them good, not just something many of them do.","That runners are generally healthy people who follow a regular routine each week.","That dawn is a pleasant and quiet time of day when there is less traffic to avoid.","That you personally want to become a runner and are willing to train every day."], why:"The advice only follows if dawn training helps. Many of them might train at dawn because of schedules or habit, and might be just as good at noon."},
 {q:"A user asks a chatbot: “Why is remote work less productive?” Which rewrite avoids building in the answer?", o:["What does the evidence say about remote and in-office productivity, and how reliable is it?","Why is remote work so much less productive than working in an office, and what can be done?","List five reasons remote workers are less productive, with an example of each reason.","Is remote work bad for business, and which kinds of company suffer most from it?"], why:"The first version leaves the answer open and asks about reliability. The others still assume or lean toward the conclusion."},
 {q:"You tell a chatbot, “I plan to retire at 50 on my savings. What is the best way to spend my days?” It cheerfully lists hobbies. What does that show?", o:["It worked inside your question’s frame; the assumption that the plan is affordable went unexamined.","It checked the plan against typical costs and found it sound before it suggested hobbies.","It shows that you should not include a plan in a question, since models cannot weigh plans.","It shows that chatbots cannot make suggestions about hobbies for people of that age."], why:"Answering the question as asked is not the same as checking its premise. If affordability matters, you need to ask about it directly, or ask what your plan assumes."},
 {q:"You ask a model to list the assumptions in your question. It lists three. What is a sensible next step?", o:["Treat the list as a start and check whether it missed the assumption that matters most.","Trust it fully: a model that lists assumptions has made sure that none remain hidden.","Ignore it, because models cannot see assumptions and the list will be made up.","Ask again until the list is longer, then rely on whichever list is the longest."], why:"The list can be useful, but it is another output to examine. A longer list is not a better one."}
],
dlg:{
 setup:"You are about to ask an AI: “Why do teenagers waste so much time on their phones?”",
 steps:[
  {ask:"What does your question assume?", opts:[
   {t:"That teenagers waste time on their phones.", r:"Yes. It has the answer built in. “Why do they waste time?” can only be answered by giving reasons for wasting time. Anything else would be dodging the question."},
   {t:"Nothing. It is just a question.", r:"Try this test: could someone answer your question without agreeing that teenagers waste time? If not, the question is carrying a claim."},
   {t:"That phones are bad.", r:"That is close, and it is part of it. But the narrower assumption is about <i>waste</i>: that the time is lost. Phones could be bad and the time still not wasted, or the reverse."}
  ]},
  {ask:"Rewrite it so it does not assume the answer.", opts:[
   {t:"Why do teenagers waste time on their phones, if they do?", r:"Better, because it admits a doubt. But “waste” still hides a judgment. Wasted by whose measure, and compared with what else they might do?"},
   {t:"How do teenagers spend time on their phones, and what do they get from it?", r:"That leaves room for the facts before the verdict. It lets the answer include both the good and the bad."},
   {t:"Do teenagers waste time on phones? Yes or no.", r:"A yes-or-no still carries the word “waste”, and it forces a verdict before any evidence. Open questions let you see what the answer rests on."}
  ]},
  {ask:"The AI gives a balanced overview in answer to your new question. Does that mean its own assumptions are gone?", opts:[
   {t:"Yes. A balanced answer has no assumptions.", r:"Every answer has some frame: what counts as a good outcome, whose experience counts, what is treated as normal. Balanced is not the same as assumption-free."},
   {t:"No. It may bring its own frame, so I should look at what it treats as normal or obvious.", r:"Right. A neutral question helps, but you still read the answer asking what it takes for granted."},
   {t:"I cannot tell without asking it what it assumed.", r:"Asking is a good move, and its list can help. Just remember the list is another output to check, and it may miss the most important assumption."}
  ]}
 ],
 close:"What this showed: before you ask, ask what your own question assumes. After you get an answer, ask what it assumes. The skill is the same for a friend’s remark and a chatbot’s reply."},
reflect:"What would you have to believe for your question to make sense, and have you checked that? Write one sentence about a question you ask often and what it quietly assumes."
});

MODS.push({
id:"evidence", n:3, title:"Evidence and verification", gist:"How would I know this is true?", glyph:"evidence",
kase:{
 h:"<p>A post goes around: “A Stanford study proved that people who laugh before meals eat 30% less.” (This is an invented example.) It has thousands of shares.</p>",
 ask:"Before you share it, what is your first check?",
 opts:[
  {t:"Look for the study itself.", r:"Right. The post is a claim about a source. The strongest first step is to find the source and see what it actually says."},
  {t:"See how many people shared it.", r:"Shares tell you the post is catchy, not that it is true. Many false things spread fast because they are surprising."},
  {t:"Ask a friend what they think.", r:"A friend can help, but only if they know something checkable. Without that, it is one more opinion about the same claim."}
 ]},
reads:[
 {t:"The idea", h:"<p>When someone says “a study found…”, there are really three questions. <b>Does the source exist?</b> <b>Does it say what is claimed?</b> <b>Is it reliable?</b> That last one means asking who did it, how many people were in it, how it was measured, and whether anyone has checked it again.</p><p>A claim and its source are two different things. People often pass along a claim that has drifted a long way from its source, like a message in a game of telephone.</p><p>Two more ideas. <b>Unverified is not the same as false</b>: it means you have not checked. And <b>the amount of checking should fit the claim</b>: more when the claim is surprising or when acting on it could cause harm.</p>"},
 {t:"A worked example", h:"<div class=\"ex\"><p>“A Stanford study proved that people who laugh before meals eat 30% less.” (invented)</p></div><p>Search for the study by its key words and the name of the university. Suppose you find nothing that matches. What can you honestly say? Not “it is false”. You can say: <i>I could not find this study, so I will not treat it as fact.</i></p><p>Maybe there is a real study behind a garbled version. If you find one, read it. Check the number of people, what was measured, and whether it says “eat 30% less” or something much smaller.</p><p>A useful trick is to <b>leave the page</b>. Instead of trusting a site’s account of itself, look for what independent sources say about it.</p>"},
 {t:"The AI twist", h:"<p>Models can produce convincing citations to studies, books, or court cases that do not exist. They often look just right: author, year, journal. A real-looking reference is not evidence.</p><p>The reverse also happens: some citations are correct. So the habit is not “never trust”, it is <b>check each one</b>. Asking a chatbot “are you sure?” is not a check, because it can repeat the same error with more confidence. Open the source yourself.</p><p>Even a real link can fail you. The page might be on a different topic, or not say what the chatbot claims. If you cannot find or open a source, treat the claim as unverified.</p>"}
],
lab:{type:"pick", title:"Which checks are real tests?",
 intro:"Pick every action that would genuinely test the claim, then check your picks.",
 prompt:"A chatbot says: “A 2019 study by Dr. Helen Marsh found that 83% of people prefer morning workouts.” (invented). Which of these are real tests of the claim?",
 opts:[
  {t:"Search for the study’s title and author outside the chatbot.", yes:true, why:"This goes to the source. If it exists, you can read it."},
  {t:"Open the study and check that it reports 83% and who was surveyed.", yes:true, why:"Existing is not enough. You need to see that it says what is claimed, about the group you care about."},
  {t:"Ask the chatbot to give a link, then open the link and read the page.", yes:true, why:"Only the second half is the test. The link on its own proves nothing until you read what is there."},
  {t:"Ask the chatbot, “Are you sure?”", yes:false, why:"It can repeat the same error with more confidence. This tests nothing new."},
  {t:"Decide whether 83% sounds reasonable.", yes:false, why:"Plausible is not checked. Invented numbers are often chosen to sound plausible."},
  {t:"Ask a second chatbot whether the first one is right.", yes:false, why:"Useful as a lead at most. Another chatbot can make the same mistake, so it is not an independent check."}
 ]},
items:[
 {q:"Headline: “New study proves chocolate makes you smarter.” You find the article rests on a survey of 50 people about what they ate that week. What is the biggest gap between the headline and the source?", o:["“Proves” is far stronger than a small survey of eating habits could ever show.","Chocolate is generally regarded as unhealthy, so any benefit claim is suspect.","Fifty is below the legal minimum number of people for any study to count.","Surveys are never evidence of anything, so the article has no real support."], why:"A small survey of eating habits can suggest a link at most. The jump from that to “proves” and “makes you smarter” is the problem. Surveys can be evidence, just not strong evidence for that claim."},
 {q:"A website says “Top scientists agree.” What is the best way to check?", o:["Look for named scientists and what they said, then see if independent sources agree.","Count how many times the phrase appears on the page and on similar sites.","Check that the website looks professional and has a clear, well-organised layout.","Ask yourself whether it feels right, given what you already know about the topic."], why:"Checks go to the source and to people outside the page. Repetition, polish, and feeling are not evidence."},
 {q:"How much checking does a claim deserve?", o:["More when it is surprising, or when acting on it could cause harm.","The same amount for every claim, so that you treat every source fairly.","Less when it comes from a confident source, since confidence reflects knowledge.","More when it is longer, because longer claims have more places to go wrong."], why:"A surprising claim is more likely to be mistaken or distorted, and a costly action raises the price of a mistake. Confidence tells you nothing about either."},
 {q:"A chatbot says: “A 2019 study by Dr. Helen Marsh found that 83% of people prefer morning workouts.” Which action best tests this?", o:["Search for the study, confirm it exists, and check that it reports that result.","Ask the chatbot “are you sure?” and see whether it repeats the same answer.","Accept it, because such a specific number is unlikely to have been made up.","Reject it, because chatbots make things up and cannot be relied on for studies."], why:"The first goes to the source. A specific number can be invented, and rejecting everything a chatbot says is as unthinking as accepting it. Check and then decide."},
 {q:"A chatbot gives you a link. You open it. The page exists but is about a different topic. What follows?", o:["The claim is not supported by that source; treat it as unverified and look elsewhere.","The link supports the claim, because a real page exists at the address given.","The claim is false, because the source the chatbot gave does not back it up.","Everything else the chatbot said is false, because one source failed to check out."], why:"A source that does not say it does not support it. That does not make the claim false, and it does not condemn the rest of the answer, but it does leave the claim unchecked."},
 {q:"A chatbot with a web search feature quotes a line and cites a real news site. What is still worth checking?", o:["Whether the page really says that, and whether it is used in the same context.","Nothing more, because a real website means that the quotation must be accurate.","Whether the website has an attractive design that makes it look trustworthy.","Whether the chatbot used polite and careful wording when it presented the quote."], why:"A real site does not guarantee the quote is accurate or fairly used. Open the page and read the surrounding text."}
],
dlg:{
 setup:"Your aunt forwards you an AI summary: “A 2021 Oxford study found that people who nap for 20 minutes live five years longer.” (An invented example.) She asks if she should start napping.",
 steps:[
  {ask:"What could you do in two minutes?", opts:[
   {t:"Search for the study to see whether it exists and what it says.", r:"That goes to the source. Suppose you find a study that looked at napping in older adults. The next question is whether it supports what the summary claims."},
   {t:"Ask the AI for its source.", r:"A reasonable step, as long as you then open the source. If it names something, find it yourself. A name and a year can be invented and still look right."},
   {t:"Ask my aunt where she saw it.", r:"Useful for tracing the claim back, but it only helps if it leads to something you can open and read."}
  ]},
  {ask:"You find a real study of older adults that reports a link between regular napping and living longer. How well does it match the summary?", opts:[
   {t:"It matches. Napping and longer life.", r:"Look closer at the words. “Linked with” is not “causes”, and the summary adds “20 minutes” and “five years”. Do those details appear in the study?"},
   {t:"Partly. It shows a link, which is weaker than saying napping adds years.", r:"Yes. A link might mean napping helps, or that healthier people nap, or that something else drives both. The summary stepped past what the study found."},
   {t:"I can’t say until I know how big the effect was and who was studied.", r:"Good instinct. Size, group, and method decide how far the claim can stretch. Check those before you repeat anything."}
  ]},
  {ask:"What do you tell your aunt?", opts:[
   {t:"It is false.", r:"You have not shown that. The careful statement is “not shown”, and the gap between a link and a cause may be exactly where the truth is hidden."},
   {t:"I could not confirm that exact claim. One related study found a link, which is weaker, so I would not count on years of extra life.", r:"That reports what you found and where the evidence stops. It also separates a claim you could not verify from a nearby claim you could."},
   {t:"It is true. There is a study.", r:"A study exists, but the summary says more than the study does. “There is a study” is not the same as “the study shows this”."}
  ]}
 ],
 close:"What this showed: verifying is a series of small questions (does it exist, does it say this, how strong is it), and honest answers include “I could not confirm that.” The same habit works on a viral post and a chatbot’s citation."},
reflect:"What would you expect to find if this claim were true, and what would you find if it were not? Write one sentence describing your usual first step when you see “a study found…”."
});
