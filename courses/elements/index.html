/* ---------- Answer checking ---------- */
function normalize(s){return String(s).trim().replace(/[−–—]/g,"-").replace(/,/g,"").replace(/\s+/g,"").replace(/%$/,"")}
function parseNum(s){s=normalize(s);if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return null;return parseFloat(s)}
function parseFrac(s){s=normalize(s);const m=s.match(/^(-?\d+)\/(-?\d+)$/);if(m){if(+m[2]===0)return null;return [+m[1],+m[2]]}const n=parseNum(s);if(n!==null&&Number.isInteger(n))return [n,1];return null}
function check(p,raw){
  if(p.t==="mc"){const i=parseInt(raw,10);if(isNaN(i))return {invalid:"Choose an option."};return {ok:i===p.a}}
  if(p.t==="yn"){const s=String(raw).trim().toLowerCase();if(!s)return {invalid:"Choose yes or no."};const v=s[0]==="y";if(s[0]!=="y"&&s[0]!=="n")return {invalid:"Choose yes or no."};return {ok:v===p.a}}
  if(p.t==="frac"){const f=parseFrac(raw);if(!f)return {invalid:"Enter a fraction like 3/4, or a whole number."};
    const same=f[0]*p.a[1]===p.a[0]*f[1];if(!same)return {ok:false};
    const [rn,rd]=red(f[0],f[1]);const simplest=Math.abs(f[0])===Math.abs(rn)&&Math.abs(f[1])===Math.abs(rd);
    if(p.simplest&&!simplest)return {ok:false,note:"That’s equal, but not yet in lowest terms."};
    if(!simplest)return {ok:true,note:`Right. In lowest terms that’s ${F(p.a[0],p.a[1])}.`};return {ok:true}}
  const v=parseNum(raw);if(v===null)return {invalid:"Enter a number, like 42 or −7."};return {ok:(p.anyOf||[p.a]).some(x=>Math.abs(v-x)<1e-9)}
}
const showAnswer=p=>p.t==="mc"?`“${p.options[p.a].replace(/\.$/,"")}”`:p.t==="yn"?(p.labels||["Yes","No"])[p.a?0:1]:p.anyOf&&p.anyOf.length>1?`any of ${p.anyOf.map(fmt).join(", ")}`:p.t==="frac"?F(p.a[0],p.a[1]):fmt(p.a);

/* ---------- State and persistence ---------- */
const KEY="elements-progress-v1";
const blank=()=>({v:1,units:{},drills:[],updated:0});
const valid=o=>o&&typeof o==="object"&&o.v===1&&o.units&&typeof o.units==="object"&&Array.isArray(o.drills);
let state=blank(), sync="local", docRef=null, saveTimer=null, view={name:"home"};
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(valid(o))state=o}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function save(){state.updated=Date.now();saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200)}
async function pushRemote(retry){
  if(!docRef)return;
  try{await docRef.set({json:JSON.stringify(state),updated:state.updated});setSync("account")}
  catch(e){if(e&&e.code==="unavailable"&&!retry){setTimeout(()=>pushRemote(true),800+Math.random()*1200)}else if(e&&(e.code==="revoked"||e.code==="invalid_argument"||e.code==="not_granted")){docRef=null;setSync("local")}}
}
function setSync(s){sync=s;const el=document.getElementById("sync");if(el)el.textContent=syncText()}
const syncText=()=>sync==="account"?"Progress is saved to your account, and also in this browser.":"Progress is saved in this browser. Export it below to keep a portable copy.";
async function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const ref=db.doc(`data/users/${id}/progress`);const snap=await ref.get();docRef=ref;
    if(snap.exists){let o=null;try{o=JSON.parse(snap.data().json)}catch(e){}
      if(valid(o)&&(o.updated||0)>(state.updated||0)){state=o;saveLocal();if(view.name==="home")render()}
      else if(state.updated>((o&&o.updated)||0))pushRemote()}
    else if(state.updated)pushRemote();
    setSync("account");
  }catch(e){}
}
/* ---------- Review scheduling, status ---------- */
const DAY=864e5, RV_DAYS=[3,7,21,60];
function record(uid,ok){
  const u=state.units[uid]||(state.units[uid]={attempts:0,correct:0,recent:[]});
  const was=status(uid).key==="done";
  u.attempts++;if(ok)u.correct++;u.recent.push(ok?1:0);if(u.recent.length>20)u.recent=u.recent.slice(-20);
  if(!was&&status(uid).key==="done")u.rv={stage:0,due:Date.now()+RV_DAYS[0]*DAY};
  save();
}
function status(uid){
  const u=state.units[uid];
  if(!u||(!u.attempts&&!u.placed))return {key:"new",label:"Not started",last:[]};
  const last=(u.recent||[]).slice(-10),right=last.reduce((a,b)=>a+b,0);
  if(last.length>=10&&right>=8)return {key:"done",label:"Mastered",last};
  if(u.placed)return {key:"done",label:"Placed out",last,placed:true};
  return {key:"doing",label:`${right} of last ${last.length} right`,last};
}
function reviewInfo(uid){
  const u=state.units[uid];if(!u||!u.rv||status(uid).key!=="done")return null;
  const ms=u.rv.due-Date.now();return {due:ms<=0,days:Math.max(1,Math.ceil(ms/DAY))};
}
const dueUnits=()=>UNITS.filter(u=>{const r=reviewInfo(u.id);return r&&r.due}).map(u=>u.id);
function applyReview(uid,right,total){
  const u=state.units[uid];if(!u)return false;
  const pass=total>0&&right/total>=2/3;
  if(!u.rv)u.rv={stage:0,due:0};
  if(pass){u.rv.stage=Math.min(u.rv.stage+1,RV_DAYS.length-1);u.rv.due=Date.now()+RV_DAYS[u.rv.stage]*DAY}
  else{u.rv.stage=0;u.rv.due=Date.now()+DAY;delete u.placed}
  return pass;
}
const CORE=()=>PARTS.slice(0,4).flatMap(p=>p[1]);
const dots=last=>`<span class="dots" aria-hidden="true">${Array.from({length:10},(_,i)=>{const v=last[i];return `<i class="${v===1?"y":v===0?"n":""}"></i>`}).join("")}</span>`;
const nextUnit=()=>UNITS.find(u=>status(u.id).key!=="done");

/* ---------- Visual models ---------- */
const Q=(el,s)=>el.querySelector(s);
const ctl=(id,label,min,max,val,step)=>`<label class="ctl"><span>${label}: <b id="${id}v">${val}</b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step||1}" value="${val}"></label>`;
const segHTML=(id,opts,curk)=>`<div class="seg" role="group" id="${id}">${opts.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===curk}">${l}</button>`).join("")}</div>`;
function bindSeg(el,id,fn){const g=Q(el,"#"+id);g.querySelectorAll("button").forEach(b=>b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));fn(b.dataset.k)})}
function setRange(el,id,min,max,val){const i=Q(el,"#"+id);i.min=min;i.max=max;const v=Math.min(max,Math.max(min,val));i.value=v;Q(el,"#"+id+"v").textContent=v;return v}
const val=(el,id)=>+Q(el,"#"+id).value;
function onRanges(el,fn){el.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",()=>{const l=Q(el,"#"+i.id+"v");if(l)l.textContent=i.value;fn()}))}
const svgIn=(W,H,inner,label)=>`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
function nline(lo,hi,step,W){W=W||360;const X=v=>20+(v-lo)*(W-40)/(hi-lo);let s=`<line x1="${X(lo)}" y1="80" x2="${X(hi)}" y2="80" stroke="var(--ink)" stroke-width="1.5"/>`;
 for(let v=lo;v<=hi;v+=step){s+=`<line x1="${X(v)}" y1="75" x2="${X(v)}" y2="85" stroke="var(--ink)" stroke-width="1.5"/><text x="${X(v)}" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(v)}</text>`}
 return {X,axis:s}}
const arc=(x1,x2,y,h,color,w)=>{if(x1===x2)return "";const m=(x1+x2)/2,d=x2>x1?1:-1;return `<path d="M${x1} ${y} Q${m} ${y-h} ${x2} ${y}" fill="none" stroke="${color}" stroke-width="${w||3}"/><path d="M${x2} ${y} l${-7*d} -6 l0 12 z" fill="${color}"/>`};
const dot=(x,y,c,r)=>`<circle cx="${x}" cy="${y}" r="${r||7}" fill="${c}" stroke="var(--ink)" stroke-width="1"/>`;
const txt=(x,y,t,o)=>`<text x="${x}" y="${y}" text-anchor="${(o&&o.a)||"middle"}" font-size="${(o&&o.s)||13}" fill="${(o&&o.c)||"var(--ink)"}">${t}</text>`;

const VIS={};

/* Book: Place value */
VIS.place={caption:"Build a number one block at a time. When a column reaches ten, the blocks trade up for one block in the next column.",
mount(el){
 let v=4382,msg="";
 const names=["ones","tens","hundreds","thousands"],sing=["one","ten","hundred","thousand"],col=["--yellow","--red","--blue","--ink"];
 el.innerHTML=`<div id="pv"></div><p class="vsum" id="psum" role="status"></p><p class="vnote" id="pnote"></p><label class="ctl" style="max-width:280px"><span>Or type a number from 0 to 9,999</span><input type="number" id="pin" min="0" max="9999" inputmode="numeric" value="${v}" class="numin"></label>`;
 const dig=()=>[v%10,Math.floor(v/10)%10,Math.floor(v/100)%10,Math.floor(v/1000)];
 function draw(focus){
  const d=dig();
  Q(el,"#pv").innerHTML=`<div class="pv">${[3,2,1,0].map(p=>`<div class="pcol"><div class="small muted">${names[p]}</div><div class="toks" aria-hidden="true">${d[p]?Array.from({length:d[p]},()=>`<i class="tok" style="background:var(${col[p]})"></i>`).join(""):`<span class="empty">0</span>`}</div><div class="pn">${d[p]}</div><div class="row" style="justify-content:center"><button type="button" class="btn ghost sm" data-p="${p}" data-s="-1" aria-label="Remove one ${sing[p]}">−</button><button type="button" class="btn ghost sm" data-p="${p}" data-s="1" aria-label="Add one ${sing[p]}">+</button></div></div>`).join("")}</div>`;
  const parts=[3,2,1,0].filter(p=>d[p]).map(p=>p===0?`${d[0]}`:`${d[p]} × ${fmt(10**p)}`);
  Q(el,"#psum").innerHTML=`${fmt(v)} = ${parts.length?parts.join(" + "):"0"}`;
  let zn="";const z=[2,1,0].filter(p=>d[p]===0&&d.slice(p+1).some(x=>x>0));
  if(z.length)zn=`The 0 in the ${names[z[0]]} place is worth nothing by itself, but it keeps the digits to its left in their proper places.`;
  Q(el,"#pnote").textContent=msg||zn;
  const pin=Q(el,"#pin");if(document.activeElement!==pin)pin.value=v;
  if(focus){const b=Q(el,`[data-p="${focus[0]}"][data-s="${focus[1]}"]`);if(b)b.focus()}
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>step(+b.dataset.p,+b.dataset.s));
 }
 function step(p,s){const o=dig()[p],nv=v+s*10**p;
  if(nv<0){msg="There is nothing left to remove.";return draw([p,s])}
  if(nv>9999){msg="This model stops at 9,999.";return draw([p,s])}
  msg=(s>0&&o===9)?`10 ${names[p]} trade up for 1 ${sing[p+1]}.`:(s<0&&o===0)?`A bigger block is broken into 10 ${names[p]}, so one can be taken away.`:"";
  v=nv;draw([p,s])}
 const fromInput=e=>{let n=parseInt(e.target.value,10);if(isNaN(n))return;n=Math.max(0,Math.min(9999,n));if(n===v)return;v=n;msg="";draw()};
 Q(el,"#pin").addEventListener("input",fromInput);Q(el,"#pin").addEventListener("change",e=>{fromInput(e);e.target.value=v});
 draw();
}};

/* Book: Addition and subtraction */
VIS.addsub={caption:"Adding is a jump along the number line. Subtracting is the gap between two points, and the gap stays the same when both points slide together.",
mount(el){
 let mode="add";
 const L=nline(0,100,10),X=L.X;
 function build(){
  el.innerHTML=`${segHTML("amode",[["add","Add"],["sub","Subtract"]],mode)}<div class="ctls">${mode==="add"?ctl("a1","First number",0,60,47)+ctl("a2","Add",0,40,38):ctl("s1","Larger number",10,100,83)+ctl("s2","Smaller number",0,83,47)+ctl("s3","Slide both by",-10,10,0)}</div><div id="sv"></div><p class="vsum" id="ssum" role="status"></p>`;
  bindSeg(el,"amode",k=>{mode=k;build()});onRanges(el,update);update();
 }
 function update(){
  if(mode==="add"){
   const a=val(el,"a1"),b=val(el,"a2"),t=Math.ceil(a/10)*10,r=t-a,friendly=a%10!==0&&b>r;
   let g=L.axis;
   if(friendly)g+=arc(X(a),X(t),80,34,"var(--yellow)")+arc(X(t),X(a+b),80,34,"var(--red)");else g+=arc(X(a),X(a+b),80,40,"var(--red)");
   g+=dot(X(a),80,"var(--blue)")+txt(X(a),64,a,{c:"var(--blue)",s:14});
   if(b>0)g+=txt(X(a+b),64,a+b,{c:"var(--red)",s:14});
   Q(el,"#sv").innerHTML=svgIn(360,120,g,`Number line showing ${a} plus ${b} equals ${a+b}`);
   Q(el,"#ssum").innerHTML=`${a} + ${b} = ${a+b}.${friendly?` Friendly route: ${a} + ${r} = ${t}, then ${t} + ${a+b-t} = ${a+b}.`:""}`;
  }else{
   const big=val(el,"s1"),sm=setRange(el,"s2",0,big,val(el,"s2")),lo=-Math.min(10,sm),hi=Math.min(10,100-big),sh=setRange(el,"s3",lo,hi,val(el,"s3")),
    p1=sm+sh,p2=big+sh,d=big-sm;
   let g=L.axis;
   if(sh!==0)g+=`<circle cx="${X(sm)}" cy="80" r="6" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/><circle cx="${X(big)}" cy="80" r="6" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
   g+=`<line x1="${X(p1)}" y1="52" x2="${X(p2)}" y2="52" stroke="var(--red)" stroke-width="4"/><line x1="${X(p1)}" y1="46" x2="${X(p1)}" y2="58" stroke="var(--red)" stroke-width="2"/><line x1="${X(p2)}" y1="46" x2="${X(p2)}" y2="58" stroke="var(--red)" stroke-width="2"/>`;
   g+=txt((X(p1)+X(p2))/2,40,`gap ${d}`,{c:"var(--red)",s:14})+dot(X(p1),80,"var(--yellow)")+dot(X(p2),80,"var(--blue)")+txt(X(p1),68,p1,{s:13})+txt(X(p2),68,p2,{s:13});
   Q(el,"#sv").innerHTML=svgIn(360,120,g,`Number line showing the gap between ${p1} and ${p2} is ${d}`);
   Q(el,"#ssum").innerHTML=`${big} − ${sm} = ${d}.${sh!==0?` Slide both by ${sh}: ${p2} − ${p1} = ${d}. The gap did not change.`:""}`;
  }
 }
 build();
}};

/* Book: Multiplication */
VIS.mult={caption:"A product is the area of a rectangle. Cut it anywhere, work out each piece, and the pieces add up to the whole.",
mount(el){
 el.innerHTML=`<div class="ctls">${ctl("m1","Rows",2,12,7)}${ctl("m2","Columns",2,30,23)}${ctl("m3","Cut after column",1,22,20)}</div><div class="row"><button type="button" class="btn ghost sm" id="tens">Cut at the tens</button></div><div id="sv"></div><p class="legend" id="mleg"></p><p class="vsum" id="msum" role="status"></p>`;
 function update(){
  const a=val(el,"m1"),b=val(el,"m2"),k=setRange(el,"m3",1,b-1,val(el,"m3")),u=Math.min(320/b,190/a),x0=20,y0=10;
  let g=`<rect x="${x0}" y="${y0}" width="${k*u}" height="${a*u}" fill="var(--blue)" fill-opacity=".85"/><rect x="${x0+k*u}" y="${y0}" width="${(b-k)*u}" height="${a*u}" fill="var(--yellow)"/>`;
  if(u>=9){let gr="";for(let i=1;i<b;i++)gr+=`<line x1="${x0+i*u}" y1="${y0}" x2="${x0+i*u}" y2="${y0+a*u}"/>`;for(let j=1;j<a;j++)gr+=`<line x1="${x0}" y1="${y0+j*u}" x2="${x0+b*u}" y2="${y0+j*u}"/>`;g+=`<g stroke="var(--paper)" stroke-opacity=".55" stroke-width=".8">${gr}</g>`}
  g+=`<line x1="${x0+k*u}" y1="${y0-4}" x2="${x0+k*u}" y2="${y0+a*u+4}" stroke="var(--ink)" stroke-width="2"/><rect x="${x0}" y="${y0}" width="${b*u}" height="${a*u}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
  const H=a*u+y0+8;
  Q(el,"#sv").innerHTML=svgIn(360,H,g,`A rectangle ${a} rows by ${b} columns, cut after column ${k}`);
  Q(el,"#mleg").innerHTML=`<span class="sw" style="background:var(--blue)"></span>${a} × ${k} = ${a*k}<span class="sw" style="background:var(--yellow);margin-left:18px"></span>${a} × ${b-k} = ${a*(b-k)}`;
  Q(el,"#msum").innerHTML=`${a} × ${b} = ${a} × ${k} + ${a} × ${b-k} = ${a*k} + ${a*(b-k)} = ${a*b}`;
 }
 onRanges(el,update);
 Q(el,"#tens").onclick=()=>{const b=val(el,"m2");const k=b>10?Math.floor(b/10)*10:Math.max(1,b-1);setRange(el,"m3",1,b-1,k);update()};
 update();
}};

/* Book: Division and divisibility */
VIS.div={caption:"Share a pile into equal groups. What cannot be shared evenly is the remainder.",
mount(el){
 el.innerHTML=`<div class="ctls">${ctl("d1","Things",1,60,29)}${ctl("d2","Groups",2,9,4)}</div><div id="dv" class="dv" aria-hidden="true"></div><p class="vsum" id="dsum" role="status"></p>
 <hr class="rule"><label class="ctl" style="max-width:280px"><span>Try the nines check: type a number</span><input type="number" id="nin" min="1" max="999999" inputmode="numeric" value="4383" class="numin"></label><p class="vsum small" id="nsum"></p>`;
 function update(){
  const n=val(el,"d1"),d=val(el,"d2"),q=Math.floor(n/d),r=n%d,dots=c=>Array.from({length:c},()=>`<i class="dot"></i>`).join("");
  Q(el,"#dv").innerHTML=Array.from({length:d},()=>`<div class="grp">${dots(q)||"&nbsp;"}</div>`).join("")+(r?`<div class="grp left">${dots(r)}</div>`:"");
  Q(el,"#dsum").innerHTML=`${n} = ${d} × ${q}${r?` + ${r}`:""}. ${r?`${r} left over, so ${n} ÷ ${d} is ${q} remainder ${r}.`:`It shares out evenly: ${n} ÷ ${d} = ${q}.`}`;
 }
 function nines(){
  let n=parseInt(Q(el,"#nin").value,10);if(isNaN(n)||n<1){Q(el,"#nsum").textContent="";return}
  n=Math.min(n,999999);const chain=[digitSum(n)];while(chain[chain.length-1]>=10)chain.push(digitSum(chain[chain.length-1]));
  const s=chain[chain.length-1],rem=n%9;
  Q(el,"#nsum").innerHTML=`Digits: ${String(n).split("").join(" + ")} = ${chain[0]}${chain.length>1?` → ${chain.slice(1).join(" → ")}`:""}. The digit sum leaves remainder ${s%9}, and ${fmt(n)} ÷ 9 leaves remainder ${rem}. ${s%9===rem?"They match.":""} ${rem===0?"So it is divisible by 9.":"So it is not divisible by 9."}`;
 }
 onRanges(el,update);Q(el,"#nin").addEventListener("input",nines);update();nines();
}};

/* Book: Negative numbers */
VIS.neg={caption:"Adding moves you along the line. Subtracting a negative number moves you the opposite way from adding a negative.",
mount(el){
 let op="+";const L=nline(-20,20,5),X=L.X;
 el.innerHTML=`${segHTML("nop",[["+","Add"],["-","Subtract"]],op)}<div class="ctls">${ctl("n1","Start",-10,10,3)}${ctl("n2","Number",-10,10,-4)}</div><div id="sv"></div><p class="vsum" id="nsum" role="status"></p><p class="vnote" id="nnote"></p>`;
 function update(){
  const a=val(el,"n1"),b=val(el,"n2"),mv=op==="+"?b:-b,res=a+mv;
  let g=L.axis;
  g+=`<line x1="${X(0)}" y1="70" x2="${X(0)}" y2="90" stroke="var(--ink)" stroke-width="3"/>`;
  g+=arc(X(a),X(res),80,mv===0?0:36,mv>0?"var(--blue)":"var(--red)")+dot(X(a),80,"var(--yellow)")+txt(X(a),64,fmt(a),{s:13})+(mv!==0?txt(X(res),64,fmt(res),{c:mv>0?"var(--blue)":"var(--red)",s:14}):"");
  Q(el,"#sv").innerHTML=svgIn(360,120,g,`Number line: ${a} ${op==="+"?"plus":"minus"} ${b} equals ${res}`);
  Q(el,"#nsum").innerHTML=`${par(a)} ${op==="+"?"+":"−"} ${par(b)} = ${fmt(res)}`;
  Q(el,"#nnote").textContent=b===0?"Adding or subtracting zero changes nothing.":op==="+"?`Adding ${par(b)} moves ${Math.abs(b)} to the ${b>0?"right":"left"}.`:`Subtracting ${par(b)} moves ${Math.abs(b)} to the ${b>0?"left":"right"}. That is the same as adding ${fmt(-b)}.`;
 }
 bindSeg(el,"nop",k=>{op=k;update()});onRanges(el,update);update();
}};

/* Book: Fractions */
VIS.frac={caption:"One amount has many names. Cut every piece into smaller equal pieces and the amount stays the same. The second view shows a fraction of a fraction as an overlap.",
mount(el){
 let mode="eq";
 function build(){
  el.innerHTML=`${segHTML("fmode",[["eq","Same amount"],["of","Fraction of a fraction"]],mode)}<div class="ctls">${mode==="eq"?ctl("f1","Parts in the whole",1,8,4)+ctl("f2","Parts shaded",0,4,3)+ctl("f3","Cut each part into",1,6,2):ctl("g1","First: out of",2,6,3)+ctl("g2","First: shaded",1,2,2)+ctl("g3","Second: out of",2,6,4)+ctl("g4","Second: shaded",1,3,3)}</div><div id="sv"></div><p class="vsum" id="fsum" role="status"></p>`;
  bindSeg(el,"fmode",k=>{mode=k;build()});onRanges(el,update);update();
 }
 function update(){
  if(mode==="eq"){
   const d=val(el,"f1"),n=setRange(el,"f2",0,d,val(el,"f2")),k=val(el,"f3"),W=320,x0=20;
   const bar=(parts,sh,y,c)=>{let s=`<rect x="${x0}" y="${y}" width="${W}" height="38" fill="var(--surface)"/><rect x="${x0}" y="${y}" width="${W*sh/parts}" height="38" fill="${c}"/>`;for(let i=0;i<=parts;i++)s+=`<line x1="${x0+W*i/parts}" y1="${y}" x2="${x0+W*i/parts}" y2="${y+38}" stroke="var(--ink)" stroke-width="${parts>24?.6:1.2}"/>`;return s+`<rect x="${x0}" y="${y}" width="${W}" height="38" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`};
   Q(el,"#sv").innerHTML=svgIn(360,130,bar(d,n,12,"var(--blue)")+bar(d*k,n*k,72,"var(--blue)")+txt(x0,66,`${n}/${d}`,{a:"start",s:12,c:"var(--muted)"})+txt(x0,126,`${n*k}/${d*k}`,{a:"start",s:12,c:"var(--muted)"}),`Two bars showing ${n} out of ${d} equals ${n*k} out of ${d*k}`);
   Q(el,"#fsum").innerHTML=`${F(n,d)} = ${F(n*k,d*k)}. Both bars are shaded to the same length.`;
  }else{
   const d1=val(el,"g1"),n1=setRange(el,"g2",1,d1-1,val(el,"g2")),d2=val(el,"g3"),n2=setRange(el,"g4",1,d2-1,val(el,"g4")),S=240,x0=20,y0=10;
   let g=`<rect x="${x0}" y="${y0}" width="${S}" height="${S}" fill="var(--surface)"/>`;
   g+=`<rect x="${x0}" y="${y0}" width="${S*n2/d2}" height="${S}" fill="var(--yellow)"/><rect x="${x0}" y="${y0}" width="${S}" height="${S*n1/d1}" fill="var(--blue)" fill-opacity=".55"/><rect x="${x0}" y="${y0}" width="${S*n2/d2}" height="${S*n1/d1}" fill="var(--red)"/>`;
   for(let i=1;i<d2;i++)g+=`<line x1="${x0+S*i/d2}" y1="${y0}" x2="${x0+S*i/d2}" y2="${y0+S}" stroke="var(--ink)" stroke-width=".8"/>`;
   for(let j=1;j<d1;j++)g+=`<line x1="${x0}" y1="${y0+S*j/d1}" x2="${x0+S}" y2="${y0+S*j/d1}" stroke="var(--ink)" stroke-width=".8"/>`;
   g+=`<rect x="${x0}" y="${y0}" width="${S}" height="${S}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
   g+=txt(x0+S+10,y0+40,"yellow: second",{a:"start",s:12})+txt(x0+S+10,y0+60,"blue: first",{a:"start",s:12})+txt(x0+S+10,y0+80,"red: both",{a:"start",s:12});
   Q(el,"#sv").innerHTML=svgIn(360,S+20,g,`Square showing ${n1}/${d1} of ${n2}/${d2}`);
   const [rn,rd]=red(n1*n2,d1*d2);
   Q(el,"#fsum").innerHTML=`${F(n1,d1)} of ${F(n2,d2)} = ${F(n1*n2,d1*d2)}${rd!==d1*d2?` = ${F(rn,rd)}`:""}. The red overlap is ${n1*n2} of the ${d1*d2} small rectangles.`;
  }
 }
 build();
}};

/* Book: Decimals and percents */

/* Book: Expressions and order of operations */
const ORDX=[
 {e:"3 + 4 × 5",st:[["3 + <span class=hl>4 × 5</span>","Multiplication comes before addition."],["<span class=hl>3 + 20</span>","Only one operation is left."],["23",""]],alt:"Adding first would give 7 × 5 = 35, a different number. That is why we need the agreement."},
 {e:"(3 + 4) × 5",st:[["<span class=hl>(3 + 4)</span> × 5","Brackets first."],["<span class=hl>7 × 5</span>","Then the multiplication."],["35",""]],alt:"Without the brackets, 3 + 4 × 5 would be 23. The brackets force the addition to come first."},
 {e:"10 − 4 + 3",st:[["<span class=hl>10 − 4</span> + 3","Same level, so go left to right."],["<span class=hl>6 + 3</span>","Then the addition."],["9",""]],alt:"Doing the addition first would give 10 − 7 = 3, which is wrong. Addition and subtraction share a level."},
 {e:"24 ÷ 4 × 2",st:[["<span class=hl>24 ÷ 4</span> × 2","Same level, so go left to right."],["<span class=hl>6 × 2</span>","Then the multiplication."],["12",""]],alt:"Doing the multiplication first would give 24 ÷ 8 = 3, which is wrong. Division and multiplication share a level."},

/* Book: Equations (balance scale) */
VIS.equations={caption:"An equation is a balance. Whatever you do to one side, do to the other. Try taking something off one side only.",
mount(el){
 let S;
 function fresh(){const a=ri(2,4),b=ri(1,9),x=ri(1,8);S={a,b,x,L:{xs:a,u:b},R:a*x+b,bad:0,done:false}}
 el.innerHTML=`<div class="scale"><div class="beam" id="beam"></div><div class="pans"><div class="pan" id="lp"></div><div class="pan" id="rp"></div></div></div><p class="vsum" id="esum" role="status"></p><p class="vnote" id="enote"></p><div class="row" id="ebtns"></div>`;
 function pans(){
  const xs=Array.from({length:S.L.xs},()=>`<i class="xb">x</i>`).join(""),un=n=>Array.from({length:n},()=>`<i class="un"></i>`).join("");
  Q(el,"#lp").innerHTML=xs+un(Math.max(0,S.L.u-S.bad));Q(el,"#rp").innerHTML=un(S.R);
  const tilt=S.bad?7:0;Q(el,"#beam").style.transform=`rotate(${tilt}deg)`;
  Q(el,"#lp").style.transform=`translateY(${-tilt*1.6}px)`;Q(el,"#rp").style.transform=`translateY(${tilt*1.6}px)`;
 }
 function text(){
  const l=`${S.L.xs===1?"x":S.L.xs+"x"}${S.L.u>0?` + ${S.L.u}`:""}`;
  const solved=S.L.xs===1&&S.L.u===0;
  Q(el,"#esum").innerHTML=S.bad?`The scale is tipped: the sides are no longer equal.`:solved?`x = ${S.R}`:`${l} = ${S.R}`;
  Q(el,"#enote").textContent=S.bad?"Taking something from only one side breaks the equation. Put it back, or take the same from the right.":solved?`Check: ${S.a} × ${S.R} + ${S.b} = ${S.a*S.R+S.b}. It balances.`:"";
  const b=[];
  if(S.bad){b.push(`<button type="button" class="btn" data-a="fix">Put it back</button>`)}
  else{
   if(S.L.u>0)b.push(`<button type="button" class="btn" data-a="sub">Take ${S.L.u} off both sides</button>`);
   if(S.L.u===0&&S.L.xs>1)b.push(`<button type="button" class="btn" data-a="div">Split both sides into ${S.L.xs} equal groups</button>`);
   if(S.L.u>0)b.push(`<button type="button" class="btn ghost" data-a="bad">Take 1 off the left side only</button>`);
  }
  b.push(`<button type="button" class="btn quiet" data-a="new">New equation</button>`);
  Q(el,"#ebtns").innerHTML=b.join("");
  el.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>act(x.dataset.a));
 }
 function act(a){
  if(a==="new")fresh();
  else if(a==="sub"){S.R-=S.L.u;S.L.u=0}
  else if(a==="div"){S.R/=S.L.xs;S.L.xs=1}
  else if(a==="bad")S.bad=1;
  else if(a==="fix")S.bad=0;
  pans();text();
  const f=Q(el,"#ebtns button");if(f&&a!=="new")f.focus();
 }
 fresh();pans();text();
}};

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
let GLRE=null;
const glRe=()=>GLRE||(GLRE=new RegExp("\\b("+GLOSS.filter(g=>g.auto!==false).map(g=>g.t).sort((a,b)=>b.length-a.length).map(escRe).join("|")+")(?:s|es)?\\b","gi"));
function linkGlossary(root){
  if(!root)return;const re=glRe(),used=new Set(),nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){const n=w.currentNode;if(n.parentElement&&!n.parentElement.closest("button,a,.frac,sup,sub,.gl,.ex,summary,.mat"))nodes.push(n)}
  nodes.forEach(n=>{const text=n.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
    while((m=re.exec(text))){const key=m[1].toLowerCase();if(used.has(key)||!GLMAP[key])continue;used.add(key);
      frag=frag||document.createDocumentFragment();frag.append(text.slice(last,m.index));
      const b=document.createElement("button");b.type="button";b.className="gl";b.dataset.term=key;b.textContent=m[0];frag.append(b);last=m.index+m[0].length}
    if(frag){frag.append(text.slice(last));n.replaceWith(frag)}});
}
const glcard=document.createElement("div");glcard.id="glcard";glcard.className="glcard";glcard.hidden=true;glcard.setAttribute("role","status");document.body.appendChild(glcard);

  const b=document.createElement("b");b.textContent=g.t.charAt(0).toUpperCase()+g.t.slice(1)+". ";
  const t=document.createTextNode(g.d+" ");
  const x=document.createElement("button");x.type="button";x.className="btn quiet";x.textContent="Close";x.onclick=hideGloss;
  glcard.append(b,t,x);glcard.hidden=false;
}

  document.getElementById("back").onclick=()=>go({name:"home"});
  const nb=document.getElementById("nextbook");if(nb)nb.onclick=()=>go({name:"unit",id:UNITS[u.n].id});
  app.querySelectorAll("[data-review]").forEach(b=>b.onclick=startReview);
  if(VIS[uid]){try{VIS[uid].mount(document.getElementById("vis"))}catch(e){document.getElementById("vis").textContent="This picture could not be loaded."}}
  linkGlossary(document.getElementById("plainbox"));linkGlossary(document.getElementById("mistakebox"));
  app.querySelectorAll(".reading").forEach(linkGlossary);
  if(uid==="proof")wireProofPanel();
  cur={uid,mode:"unit"};newProblem();
}
function updateUnitStatus(){const el=document.getElementById("ustatus");if(!el||!cur)return;const s=status(cur.uid);el.innerHTML=`${s.label} ${s.last.length?dots(s.last):""}`}

const isLast=()=>cur.kind==="place"?(cur.ui===cur.order.length-1&&cur.k===1):cur.i===cur.queue.length-1;
function newProblem(){
  const uid=cur.mode==="drill"?(cur.kind==="place"?cur.order[cur.ui]:cur.queue[cur.i]):cur.uid;
  cur.p=makeProblem(uid);cur.done=false;cur.hint=false;
  drawProblem();
}
function drawProblem(){
  const p=cur.p,box=document.getElementById("pbox");
  const numeric=p.t==="num"&&["place","addsub","mult","div"].includes(p.unit);
  box.innerHTML=`<div class="prop">
    <div class="label">${cur.mode==="drill"?`Book ${UNIT[p.unit].n}, ${UNIT[p.unit].title}`:"Problem"}</div>
    <p class="q${p.q.replace(/<[^>]+>/g,"").length>90?" long":""}">${p.q}</p>
    ${p.t==="mc"?`<div class="options">${p.options.map((o,i)=>`<button class="btn ghost opt" data-mc="${i}">${o}</button>`).join("")}</div>${cur.mode==="drill"?"":`<p><button class="btn quiet" id="hintbtn">Hint</button></p>`}`
    :p.t==="yn"?`<div class="answer-row"><button class="btn ghost" data-yn="yes">${(p.labels||["Yes","No"])[0]}</button><button class="btn ghost" data-yn="no">${(p.labels||["Yes","No"])[1]}</button>${cur.mode==="drill"?"":`<button class="btn quiet" id="hintbtn">Hint</button>`}</div>`
    :`<form class="answer-row" id="af" autocomplete="off"><input id="ans" ${numeric?'inputmode="decimal"':'inputmode="text"'} aria-label="Your answer" placeholder="${p.t==="frac"?"e.g. 3/4":"Your answer"}"><button class="btn" type="submit">Check</button>${cur.mode==="drill"?"":`<button class="btn quiet" type="button" id="hintbtn">Hint</button>`}</form>`}
    ${cur.kind==="place"?`<p style="margin:10px 0 0"><button class="btn quiet" type="button" id="dk">I don’t know this one</button></p>`:""}
    <div class="err" id="err" role="alert"></div>
    <div class="feedback" id="fb"></div>
  </div>`;
  const f=document.getElementById("af");
  if(f){f.onsubmit=e=>{e.preventDefault();if(cur.done)advance();else submit(document.getElementById("ans").value)};const i=document.getElementById("ans");i.focus({preventScroll:true})}
  box.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{if(!cur.done)submit(b.dataset.yn)});
  box.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{if(!cur.done){cur.pickedMc=+b.dataset.mc;submit(b.dataset.mc)}});
  const dk=document.getElementById("dk");if(dk)dk.onclick=()=>{if(!cur.done)submit("",true)};
  const hb=document.getElementById("hintbtn");if(hb)hb.onclick=()=>{if(cur.hint||cur.done)return;cur.hint=true;document.getElementById("fb").innerHTML=`<p class="hint">${p.hint}</p>`};
}
function submit(raw,force){
  const p=cur.p,r=force?{ok:false,skipped:true}:check(p,raw),err=document.getElementById("err");
  if(r.invalid){err.textContent=r.invalid;return}
  err.textContent="";cur.done=true;cur.lastRaw=force?"(no answer)":raw;
  if(cur.kind!=="place")record(p.unit,r.ok);
  if(cur.mode==="drill"){
    if(r.ok)cur.score++;else cur.misses.push(p);
    const pu=cur.per[p.unit]||(cur.per[p.unit]={r:0,t:0});pu.t++;if(r.ok)pu.r++;
    if(cur.kind==="place"&&r.ok)cur.right++;
  }
  const fb=document.getElementById("fb"),canExplain=!r.ok&&sampleCap&&cur.kind!=="place";
  fb.innerHTML=`<p class="verdict ${r.ok?"ok":"bad"}">${r.ok?"Right.":r.skipped?`No problem. The answer is ${showAnswer(p)}.`:`Not quite. The answer is ${showAnswer(p)}.`}</p>
    ${r.note?`<p>${r.note}</p>`:""}
    <p class="${r.ok?"muted":""}">${p.why}</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="nextbtn">${cur.mode==="drill"&&isLast()?"See results":"Next problem"}</button><span class="small muted">or press Enter</span>${canExplain?`<button class="btn quiet" type="button" id="explbtn">Explain it another way</button>`:""}</div>
    ${canExplain?`<div class="expl" id="expl" hidden aria-label="Another explanation"><div id="expltxt"></div><p class="small muted" id="explnote" hidden>Claude wrote this just now, so it can contain mistakes. The answer checked above comes from the app.</p></div>`:""}`;
  document.querySelector(".prop").classList.add("flash");
  const inp=document.getElementById("ans");if(inp){inp.readOnly=true}
  document.querySelectorAll("[data-yn]").forEach(b=>b.disabled=true);
  document.querySelectorAll("[data-mc]").forEach(b=>{b.disabled=true;const i=+b.dataset.mc;if(i===p.a)b.classList.add("right");else if(i===cur.pickedMc)b.classList.add("wrong")});
  const dk=document.getElementById("dk");if(dk)dk.disabled=true;
  document.getElementById("nextbtn").onclick=advance;
  const eb=document.getElementById("explbtn");if(eb)eb.onclick=explainAnother;
  if(p.t==="yn"||p.t==="mc"||force)document.getElementById("nextbtn").focus({preventScroll:true});
  if(cur.mode==="unit"){updateUnitStatus();const s=status(cur.uid);if(s.key==="done"&&!cur.qedShown){cur.qedShown=true;document.querySelector(".prop").insertAdjacentHTML("beforeend",`<span class="qed">Mastered. Q.E.D.</span>`)}}
  if(cur.mode==="drill")updateDrillMeta();
}
function advance(){
  if(cur.finished)return;
  if(cur.kind==="place"){
    cur.k++;
    if(cur.k>=2){
      const ok=cur.right===2;cur.results.push({id:cur.order[cur.ui],ok});cur.consec=ok?0:cur.consec+1;
      cur.ui++;cur.k=0;cur.right=0;
      if(cur.consec>=2||cur.ui>=cur.order.length)return finishPlacement();
    }
    updateDrillMeta();return newProblem();
  }
  if(cur.mode==="drill"){cur.i++;if(cur.i>=cur.queue.length)return finishDrill();updateDrillMeta()}
  newProblem();
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&cur&&cur.done&&cur.p&&(cur.p.t==="yn"||cur.p.t==="mc")&&document.activeElement&&document.activeElement.id!=="nextbtn"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();advance()}});

/* ----- Drill, review and placement ----- */
function startDrill(){
  let pool=UNITS.filter(u=>status(u.id).key!=="new").map(u=>u.id);
  if(!pool.length)pool=["place","addsub","mult"];
  const queue=Array.from({length:10},(_,i)=>pool[i%pool.length]);
  cur={mode:"drill",kind:"drill",queue:shuffle(queue),i:0,score:0,misses:[],start:Date.now(),per:{}};
  view={name:"drill"};render();window.scrollTo(0,0);
}
function startReview(){
  const ids=dueUnits().slice(0,5);if(!ids.length)return;
  const queue=[];ids.forEach(id=>{for(let i=0;i<3;i++)queue.push(id)});
  cur={mode:"drill",kind:"review",queue:shuffle(queue),i:0,score:0,misses:[],start:Date.now(),per:{}};
  view={name:"drill"};render();window.scrollTo(0,0);
}
function startPlacement(){
  const order=CORE().filter(id=>status(id).key!=="done");if(!order.length)return;
  cur={mode:"drill",kind:"place",queue:[],order,ui:0,k:0,right:0,consec:0,results:[],i:0,score:0,misses:[],start:Date.now(),per:{}};
  view={name:"drill"};render();window.scrollTo(0,0);
}
function renderDrill(){
  const title=cur.kind==="review"?"Review":cur.kind==="place"?"Placement quiz":"Drill";
  app.innerHTML=`<p class="back"><button class="btn quiet" id="back">All books</button>${cur.kind==="place"?`<button class="btn quiet" id="fin">Finish early</button>`:""}</p>
  <div class="practice-head"><h2 style="font-size:36px">${title}</h2></div>
  <div class="drill-meta"><span id="dprog"></span><span id="dtime"></span></div>
  <div id="pbox"></div>`;
  document.getElementById("back").onclick=()=>{clearInterval(cur.timer);go({name:"home"})};
  const fin=document.getElementById("fin");if(fin)fin.onclick=finishPlacement;
  clearInterval(cur.timer);cur.timer=setInterval(updateDrillMeta,1000);
  updateDrillMeta();newProblem();
}
function updateDrillMeta(){const a=document.getElementById("dprog"),b=document.getElementById("dtime");if(!a||!cur||cur.mode!=="drill"){if(cur&&cur.timer)clearInterval(cur.timer);return}
  if(cur.kind==="place"){const id=cur.order[Math.min(cur.ui,cur.order.length-1)];a.textContent=`${UNIT[id].title}, problem ${Math.min(cur.k+1,2)} of 2`}
  else a.textContent=`Problem ${Math.min(cur.i+1,cur.queue.length)} of ${cur.queue.length}, ${cur.score} right`;
  b.textContent=fmtTime((Date.now()-cur.start)/1000)}
function finishDrill(){
  if(cur.finished)return;cur.finished=true;
  clearInterval(cur.timer);const secs=(Date.now()-cur.start)/1000;
  let extra="";
  if(cur.kind==="drill"){state.drills.push({at:Date.now(),score:cur.score,total:cur.queue.length,secs:Math.round(secs)});if(state.drills.length>30)state.drills=state.drills.slice(-30)}
  if(cur.kind==="review"){
    const rows=Object.entries(cur.per).map(([id,pu])=>{const pass=applyReview(id,pu.r,pu.t),u=state.units[id],days=Math.max(1,Math.round((u.rv.due-Date.now())/DAY));
      return `<li>${UNIT[id].title}: ${pu.r} of ${pu.t} right. ${pass?`Next review in ${days} day${days===1?"":"s"}.`:`Worth more practice. It comes back for review tomorrow.`}</li>`});
    extra=`<p>By book:</p><ul class="misses">${rows.join("")}</ul>`;
  }
  save();
  const again=cur.kind==="review"?(dueUnits().length?`<button class="btn" id="again">Review the next books</button>`:""):`<button class="btn" id="again">Drill again</button>`;
  document.getElementById("pbox").innerHTML=`<div class="prop">
    <p class="q">${cur.score} of ${cur.queue.length} in ${fmtTime(secs)}</p>
    ${extra}
    ${cur.misses.length?`<p>Worth another look:</p><ol class="misses">${cur.misses.map(p=>`<li><span>${p.q}</span><br><span class="small">Answer ${showAnswer(p)}. ${p.why}</span></li>`).join("")}</ol>`:`<p>No misses.</p>`}
    <div class="row" style="margin-top:16px">${again}<button class="btn ghost" id="home">All books</button></div>
  </div>`;
  document.getElementById("dprog").textContent="Finished";
  const ag=document.getElementById("again");if(ag)ag.onclick=cur.kind==="review"?startReview:startDrill;
  document.getElementById("home").onclick=()=>go({name:"home"});
}
function finishPlacement(){
  if(cur.finished)return;cur.finished=true;
  clearInterval(cur.timer);
  const passed=cur.results.filter(x=>x.ok).map(x=>x.id);
  passed.forEach(id=>{const u=state.units[id]||(state.units[id]={attempts:0,correct:0,recent:[]});
    if(status(id).key!=="done"){u.placed=Date.now();u.rv={stage:0,due:Date.now()+RV_DAYS[0]*DAY}}});
  save();
  const nx=nextUnit();
  document.getElementById("pbox").innerHTML=`<div class="prop">
    <p class="q">${passed.length?`${passed.length} book${passed.length===1?"":"s"} placed out`:"Starting from the beginning"}</p>
    ${passed.length?`<p>You answered both problems correctly in: ${passed.map(id=>UNIT[id].title).join(", ")}. These are marked as placed out. They come back for a short review in 3 days, which checks that they really are solid.</p>`:`<p>No books were placed out, so the path begins at the start. That is a fine place to be.</p>`}
    ${nx?`<p>Your path starts at <b>Book ${UNIT[nx.id].n}, ${nx.title}.</b></p>`:""}
    <div class="row" style="margin-top:16px">${nx?`<button class="btn" id="startnx">Start Book ${UNIT[nx.id].n}</button>`:""}<button class="btn ghost" id="home">All books</button></div>
  </div>`;
  document.getElementById("dprog").textContent="Finished";document.getElementById("dtime").textContent="";
  const fin=document.getElementById("fin");if(fin)fin.remove();
  const sn=document.getElementById("startnx");if(sn)sn.onclick=()=>go({name:"unit",id:nx.id});
  document.getElementById("home").onclick=()=>go({name:"home"});
}

render();
connect();
connectSample();
</script>
