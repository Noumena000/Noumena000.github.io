<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elements: mathematics from the ground up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --surface:#F1F0EB; --ink:#000; --muted:#5E5E58; --rule:#D6D5CF;
  --red:#C33A22; --yellow:#E3AE1C; --blue:#1D5A9E; --focus:#1D5A9E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
    --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121314; --surface:#1C1D20; --ink:#EEEDE8; --muted:#A5A49E; --rule:#36373C;
  --red:#E4604A; --yellow:#EDC24A; --blue:#74A5DE; --focus:#74A5DE; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Libre Caslon Text", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size:18px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
main{max-width:680px; margin:0 auto; padding:40px 22px 96px}
h1,h2,h3{font-weight:400; line-height:1.15; margin:0}
p{margin:0 0 .9em}
a{color:var(--blue)}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:15px; line-height:1.5}

/* Hero */
.hero{padding:24px 0 36px; border-bottom:1px solid var(--rule); margin-bottom:36px}
.hero h1{font-size:clamp(60px,15vw,112px); letter-spacing:-.02em; margin:14px 0 10px}
.hero .lede{font-size:21px; font-style:italic; max-width:30em; margin:0}
.trio{display:block}

/* Next up */
.next{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin:0 0 44px}
.next p{margin:0; flex:1 1 260px}

/* Buttons */
.btn{
  appearance:none; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:10px 20px; border-radius:2px; cursor:pointer; font-size:17px; line-height:1.3;
}
.btn:hover{background:var(--blue); border-color:var(--blue)}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover{background:var(--surface); color:var(--ink); border-color:var(--ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--blue); padding:10px 6px; text-decoration:underline; text-underline-offset:3px}
.btn.quiet:hover{background:transparent; color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:default}

/* Section headings */
.sec{margin:0 0 48px}
.sec h2{font-size:30px; margin-bottom:6px}
.sec > .muted{margin-bottom:18px}

/* Path of books */
.books{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.books li{border-bottom:1px solid var(--rule)}
.book{
  display:grid; grid-template-columns:44px 1fr auto; gap:16px; align-items:center;
  width:100%; text-align:left; background:none; border:0; padding:16px 4px; cursor:pointer;
}
.book:hover{background:var(--surface)}
.book .num{font-size:14px; color:var(--muted); display:block}
.book .title{font-size:21px; display:block; line-height:1.25}
.book .gist{font-size:15px; color:var(--muted); display:block; line-height:1.45; margin-top:2px}
.state{font-size:14px; color:var(--muted); text-align:right; white-space:nowrap}
.state.done{color:var(--blue); font-style:italic}
.dots{display:inline-flex; gap:3px; margin-top:4px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--rule); display:block}
.dots i.y{background:var(--blue)} .dots i.n{background:var(--red)}

.later{list-style:none; padding:0; margin:0; columns:2 240px; column-gap:28px}
.later li{color:var(--muted); font-size:16px; padding:3px 0; break-inside:avoid}

/* Unit view */
.back{margin:0 0 20px}
.unit-head{display:flex; gap:18px; align-items:flex-start; margin-bottom:22px}
.unit-head h1{font-size:clamp(36px,8vw,52px); letter-spacing:-.01em}
.unit-head .num{color:var(--muted); font-size:16px}
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer; padding:14px 0; font-size:20px; list-style:none; display:flex; justify-content:space-between; align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--muted); font-size:22px}
details[open] summary::after{content:"−"}
.reading{padding:0 0 18px}
.reading .ex{background:var(--surface); padding:12px 16px; margin:4px 0 14px; border-left:3px solid var(--blue)}

/* Practice */
.practice{margin-top:40px}
.practice-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.practice-head h2{font-size:28px}
.prop{
  border:1.5px solid var(--ink); padding:28px 24px 24px; margin-top:12px; position:relative;
}
.prop .label{font-size:14px; color:var(--muted); margin-bottom:10px}
.q{font-size:clamp(26px,6vw,36px); line-height:1.35; margin:0 0 22px; overflow-wrap:anywhere}
.q .big{white-space:nowrap}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .08em; font-size:.82em}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .15em}
.frac > span:last-child{padding:0 .15em}
.mat{display:inline-grid; grid-template-columns:auto auto; gap:0 .55em; border-left:1.5px solid currentColor; border-right:1.5px solid currentColor; padding:0 .3em; vertical-align:middle; font-size:.78em; line-height:1.2; text-align:right; margin:0 .1em}
.mat{background:linear-gradient(currentColor,currentColor) left top/.35em 1.5px no-repeat,linear-gradient(currentColor,currentColor) left bottom/.35em 1.5px no-repeat,linear-gradient(currentColor,currentColor) right top/.35em 1.5px no-repeat,linear-gradient(currentColor,currentColor) right bottom/.35em 1.5px no-repeat}
.mat.col{grid-template-columns:auto}
.q sup,.reading sup{font-size:.6em}
.part{font-size:19px; color:var(--muted); margin:26px 0 8px}
.part:first-of-type{margin-top:6px}
.unit-next{margin-top:36px; padding-top:18px; border-top:1px solid var(--rule)}
.q.long{font-size:clamp(21px,4.6vw,26px)}
.options{display:flex; flex-direction:column; gap:8px; align-items:stretch}
.btn.opt{text-align:left; font-size:18px; line-height:1.45; padding:10px 14px}
.btn.opt[disabled]{opacity:.5}
.btn.opt.right[disabled],.btn.opt.wrong[disabled]{opacity:1}
.btn.opt.right{border-color:var(--blue); color:var(--blue); background:transparent}
.btn.opt.wrong{border-color:var(--red); color:var(--red); background:transparent}
.argument{display:block; font-size:.78em; line-height:1.5; margin-bottom:.7em}
.argument span{display:block}
.argument span:last-child{border-top:1.5px solid currentColor; margin-top:.35em; padding-top:.25em}
.answer-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.answer-row input{
  flex:1 1 160px; min-width:0; font-size:22px; padding:9px 12px; border:1.5px solid var(--ink);
  background:var(--paper); border-radius:2px;
}
.feedback{margin-top:18px; min-height:1px}
.verdict{font-size:21px; margin:0 0 6px}
.verdict.ok{color:var(--blue)} .verdict.bad{color:var(--red)}
.hint{margin-top:14px; font-style:italic; color:var(--muted)}
.qed{position:absolute; right:16px; bottom:10px; font-size:14px; color:var(--blue); font-style:italic}
.err{color:var(--red); font-size:15px; margin-top:8px}

/* Drill */
.drill-meta{display:flex; justify-content:space-between; color:var(--muted); font-size:15px; margin-bottom:4px}
.misses{margin:10px 0 0; padding-left:1.2em}
.misses li{margin-bottom:10px}

/* Progress */
.statgrid{width:100%; border-collapse:collapse; font-size:16px; margin-bottom:18px}
.statgrid th,.statgrid td{text-align:left; padding:7px 8px 7px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.statgrid th{font-weight:400; color:var(--muted); font-size:14px}
.tablewrap{overflow-x:auto}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
textarea{width:100%; min-height:150px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; padding:10px; border:1.5px solid var(--rule); background:var(--surface); border-radius:2px; margin:10px 0}
.sync{font-size:14px; color:var(--muted); margin-top:12px}

@media (max-width:520px){
  body{font-size:17px}
  main{padding:28px 18px 80px}
  .book{grid-template-columns:36px 1fr; }
  .book .state{grid-column:2; text-align:left}
  .prop{padding:22px 16px 20px}
}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .5s ease-out}
  @keyframes flash{from{background:var(--surface)} to{background:transparent}}
}

/* ---------- Additions ---------- */
[hidden]{display:none!important}
.btn.sm{padding:6px 12px; font-size:16px; min-height:44px; min-width:44px}
.numin{font-size:20px; padding:8px 10px; border:1.5px solid var(--ink); background:var(--paper); border-radius:2px; width:100%}
.rule{border:0; border-top:1px solid var(--rule); margin:20px 0 14px}

/* Plain-language and mistake boxes */
.plain,.mistake{padding:14px 18px 12px; margin:0 0 14px; border-left:3px solid var(--blue); background:var(--surface)}
.mistake{border-left-color:var(--red)}
.plain h2,.mistake h2{font-size:15px; font-weight:400; color:var(--muted); margin:0 0 4px; letter-spacing:.02em}
.plain p,.mistake p{margin:0}

/* Visual models */
.see{margin:30px 0 22px}
.see h2{font-size:26px; margin-bottom:4px}
.vis{border:1.5px solid var(--ink); padding:16px 16px 14px; margin-top:10px}
.vis svg{width:100%; height:auto; display:block; max-height:340px}
.vis svg text{font-family:inherit}
.ctls{display:flex; flex-wrap:wrap; gap:10px 24px; margin:12px 0 6px}
.ctl{display:flex; flex-direction:column; gap:2px; font-size:15px; min-width:150px; flex:1 1 160px}
.ctl input[type=range]{width:100%; accent-color:var(--blue); min-height:32px}
.vsum{margin:10px 0 0; font-size:19px; line-height:1.55}
.vsum.small{font-size:16px}
.vnote{margin:4px 0 0; font-size:15px; color:var(--muted); min-height:1.4em}
.seg{display:flex; width:100%; max-width:460px; border:1.5px solid var(--ink); border-radius:2px; overflow:hidden; margin-bottom:6px}
.seg button{flex:1 1 0; border:0; background:transparent; padding:8px 10px; cursor:pointer; font-size:16px; min-height:44px; line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.pv{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.pcol{border:1px solid var(--rule); padding:8px 4px 10px; text-align:center; min-width:0}
.toks{min-height:68px; display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start; gap:3px; padding:6px 2px}
.tok{width:14px; height:14px; display:inline-block; border:1px solid var(--ink)}
.toks .empty{color:var(--muted); font-size:22px; line-height:1}
.pn{font-size:30px; line-height:1.2; margin:2px 0 6px}
.dv{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.grp{border:1.5px solid var(--ink); padding:5px; display:flex; flex-wrap:wrap; gap:3px; min-width:34px; max-width:100%; align-content:flex-start}
.grp.left{border-style:dashed; border-color:var(--red)}
.dot{width:12px; height:12px; border-radius:50%; background:var(--blue); display:inline-block}
.grp.left .dot{background:var(--red)}
.hl{border-bottom:3px solid var(--red); background:var(--surface); padding:0 .12em}
.ostep{font-size:clamp(24px,6vw,34px); margin:16px 0 4px; line-height:1.3}
.scale{margin:8px 0 10px}
.beam{height:6px; background:var(--ink); border-radius:3px; margin:0 8%; transform-origin:50% 50%}
.pans{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:-3px}
.pan{min-height:120px; border-bottom:5px solid var(--ink); padding:8px; display:flex; flex-wrap:wrap; align-content:flex-end; gap:5px}
.xb{width:38px; height:38px; background:var(--blue); color:var(--paper); display:flex; align-items:center; justify-content:center; font-style:italic}
.un{width:15px; height:15px; border-radius:50%; background:var(--yellow); border:1px solid var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .beam,.pan{transition:transform .4s ease}
}

/* Review chips */
.rv{display:block; font-size:13px; color:var(--muted); margin-top:2px}
.rv.due{color:var(--red)}

/* Glossary */
.gl{border:0; background:none; padding:0; font:inherit; color:inherit; cursor:help; border-bottom:1.5px dotted var(--blue)}
.glcard{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:min(640px,calc(100vw - 28px)); background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); padding:12px 16px; z-index:50; font-size:17px; line-height:1.5; box-shadow:0 4px 18px rgba(0,0,0,.2)}
.glcard .btn.quiet{padding:4px 6px}
.glist{margin:14px 0 0}
.glist .gi{border-top:1px solid var(--rule); padding:10px 0}
.glist dt{font-size:20px}
.glist dt::first-letter{text-transform:uppercase}
.glist dd{margin:2px 0 0; color:var(--muted); font-size:17px; line-height:1.5}

/* Claude-assisted extras */
.expl{margin-top:14px; padding:12px 16px; border-left:3px solid var(--yellow); background:var(--surface); font-size:17px; line-height:1.55}
.expl #expltxt,.expl#pout{white-space:pre-wrap}
.proofbox textarea{font-family:inherit; font-size:17px; min-height:140px}

.pcol .btn.sm{font-size:24px; padding:2px 10px; line-height:1}
.legend{margin:8px 0 0; font-size:16px; display:flex; flex-wrap:wrap; align-items:center; gap:4px}
.sw{display:inline-block; width:14px; height:14px; border:1px solid var(--ink); margin-right:6px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
/* ---------- small helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const red=(n,d)=>{const g=gcd(n,d);let a=n/g,b=d/g;if(b<0){a=-a;b=-b}return [a===0?0:a,b]};
const fmt=n=>{const s=Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:3});return n<0?"−"+s:s};
const par=n=>n<0?"("+fmt(n)+")":fmt(n);
const F=(n,d)=>d===1?fmt(n):`<span class="frac"><span>${typeof n==="number"?fmt(n):n}</span><span>${typeof d==="number"?fmt(d):d}</span></span>`;
const term=n=>n>=0?`+ ${fmt(n)}`:`− ${fmt(-n)}`;
const coef=(a,v)=>a===1?v:a===-1?`−${v}`:`${fmt(a)}${v}`;
const termx=(a,v)=>a>=0?`+ ${a===1?"":fmt(a)}${v}`:`− ${a===-1?"":fmt(-a)}${v}`;
const M=(m,col)=>`<span class="mat${col?" col":""}">${m.map(x=>`<span>${typeof x==="number"?fmt(x):x}</span>`).join("")}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digitSum=n=>String(n).split("").reduce((a,c)=>a+(+c),0);
const places=["ones","tens","hundreds","thousands","ten-thousands"];

/* ---------- Byrne-style glyphs ---------- */
const G={
  place:`<rect x="4" y="26" width="8" height="10" fill="var(--yellow)"/><rect x="16" y="16" width="8" height="20" fill="var(--red)"/><rect x="28" y="4" width="8" height="32" fill="var(--blue)"/>`,
  addsub:`<circle cx="15" cy="20" r="11" fill="var(--yellow)"/><circle cx="25" cy="20" r="11" fill="var(--blue)" fill-opacity=".85"/>`,
  mult:`<rect x="4" y="8" width="32" height="24" fill="var(--red)"/><rect x="24" y="8" width="12" height="24" fill="var(--yellow)"/><line x1="24" y1="8" x2="24" y2="32" stroke="var(--ink)" stroke-width="1.5"/>`,
  div:`<path d="M20 4 A16 16 0 0 1 20 36 Z" fill="var(--blue)"/><path d="M20 4 A16 16 0 0 0 20 36 Z" fill="var(--yellow)"/><line x1="20" y1="2" x2="20" y2="38" stroke="var(--ink)" stroke-width="1.5"/>`,
  neg:`<line x1="2" y1="20" x2="38" y2="20" stroke="var(--ink)" stroke-width="1.5"/><circle cx="9" cy="20" r="5" fill="var(--red)"/><circle cx="31" cy="20" r="5" fill="var(--blue)"/><line x1="20" y1="15" x2="20" y2="25" stroke="var(--ink)" stroke-width="1.5"/>`,
  frac:`<rect x="4" y="4" width="16" height="16" fill="var(--red)"/><rect x="20" y="4" width="16" height="16" fill="var(--red)"/><rect x="4" y="20" width="16" height="16" fill="var(--red)"/><rect x="4" y="4" width="32" height="32" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`,
  pct:`<rect x="4" y="4" width="32" height="32" fill="var(--blue)"/><rect x="4" y="24" width="32" height="12" fill="var(--yellow)"/><rect x="4" y="4" width="32" height="32" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`,
  order:`<rect x="4" y="4" width="32" height="32" fill="var(--blue)"/><path d="M20 9 L32 31 L8 31 Z" fill="var(--red)"/><circle cx="20" cy="24" r="4" fill="var(--yellow)"/>`,
  ratio:`<rect x="4" y="20" width="9" height="16" fill="var(--red)"/><rect x="18" y="4" width="18" height="32" fill="var(--blue)"/>`,
  equations:`<path d="M20 22 L27 36 L13 36 Z" fill="var(--ink)"/><line x1="2" y1="22" x2="38" y2="22" stroke="var(--ink)" stroke-width="1.5"/><rect x="4" y="10" width="11" height="11" fill="var(--red)"/><circle cx="30.5" cy="15.5" r="6" fill="var(--blue)"/>`,
  algebra:`<rect x="4" y="4" width="22" height="22" fill="var(--blue)"/><rect x="26" y="4" width="10" height="22" fill="var(--yellow)"/><rect x="4" y="26" width="22" height="10" fill="var(--yellow)"/><rect x="26" y="26" width="10" height="10" fill="var(--red)"/>`,
  geometry:`<path d="M4 36 L36 36 L4 8 Z" fill="var(--red)"/><rect x="4" y="29" width="7" height="7" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="30" cy="12" r="6" fill="var(--yellow)"/>`,
  functions:`<line x1="6" y1="4" x2="6" y2="36" stroke="var(--ink)" stroke-width="1.5"/><line x1="4" y1="34" x2="38" y2="34" stroke="var(--ink)" stroke-width="1.5"/><line x1="8" y1="30" x2="36" y2="6" stroke="var(--blue)" stroke-width="3"/><circle cx="22" cy="18" r="3.5" fill="var(--red)"/>`,
  exponents:`<rect x="4" y="32" width="4" height="4" fill="var(--yellow)"/><rect x="10" y="28" width="8" height="8" fill="var(--red)"/><rect x="20" y="20" width="16" height="16" fill="var(--blue)"/>`,
  trig:`<circle cx="20" cy="20" r="16" fill="var(--yellow)"/><path d="M20 20 L33.3 11.1 L33.3 20 Z" fill="var(--red)"/><line x1="20" y1="20" x2="36" y2="20" stroke="var(--ink)" stroke-width="1.5"/>`,
  probability:`<rect x="4" y="4" width="32" height="32" rx="3" fill="var(--blue)"/><circle cx="12" cy="12" r="3" fill="var(--paper)"/><circle cx="28" cy="12" r="3" fill="var(--paper)"/><circle cx="20" cy="20" r="3" fill="var(--paper)"/><circle cx="12" cy="28" r="3" fill="var(--paper)"/><circle cx="28" cy="28" r="3" fill="var(--paper)"/>`,

/* ---------- Curriculum ---------- */
const UNITS=[
{id:"place", title:"Place value", gist:"What a numeral actually says, and why ten symbols are enough.",
 idea:`<p>The numeral 4,382 is shorthand. It means 4 thousands, 3 hundreds, 8 tens and 2 ones: 4×1,000 + 3×100 + 8×10 + 2. The same digit means different things depending on where it stands.</p><p>Each place is worth ten of the place to its right. That single rule generates the whole system.</p>`,
 why:`<p>Positional notation lets ten symbols name every whole number, because position carries part of the meaning. The quiet hero is zero: in 3,052, the 0 says “no hundreds” and holds the place open, so the 3 still means thousands. Roman numerals had no such placeholder, which is a large part of why arithmetic in them was so awkward.</p>`,
 moves:`<p>Read numbers in expanded form when they get unwieldy. Multiplying by 10 shifts every digit one place left (47 → 470); dividing by 10 shifts right. “How many tens are in 3,460?” is just 346: drop the last zero.</p><div class="ex">Rounding 3,746 to the nearest hundred: it sits between 3,700 and 3,800. The tens digit is 4, less than halfway, so 3,700.</div>`},
{id:"addsub", title:"Addition and subtraction", gist:"Rearranging freely, and treating subtraction as distance.",
 idea:`<p>Addition combines amounts. Subtraction finds the difference between them: 83 − 47 asks how far apart 47 and 83 are on the number line.</p><p>For addition, order and grouping don’t matter: 17 + 25 + 13 = (17 + 13) + 25. You are free to rearrange toward friendly numbers.</p>`,
 why:`<p>A sum counts a collection, and regrouping a collection doesn’t change how many things are in it. Those are the commutative and associative laws.</p><p>Subtraction has neither law (5 − 3 ≠ 3 − 5), but it has its own invariance: shifting both numbers by the same amount keeps the distance between them. So 800 − 399 = 801 − 400. That one fact justifies most mental subtraction tricks.</p>`,
 moves:`<p><b>Compensation:</b> 47 + 38 = 47 + 40 − 2 = 85. Round one number, then repay the difference.</p><p><b>Equal shift:</b> 800 − 399 = 801 − 400 = 401.</p><p><b>Count up:</b> 1,000 − 647: from 647 to 650 is 3, to 700 is 50, to 1,000 is 300. Total 353.</p>`},
{id:"mult", title:"Multiplication", gist:"Groups, areas, and the one law behind every shortcut.",
 idea:`<p>7 × 23 counts 7 groups of 23, or the area of a 7-by-23 rectangle. The area picture is the one worth keeping: it scales all the way up to algebra.</p>`,
 why:`<p>Cut a 7-by-23 rectangle into a 7-by-20 piece and a 7-by-3 piece. The total area is unchanged, so 7 × 23 = 7 × 20 + 7 × 3 = 140 + 21 = 161. That is the distributive law: a × (b + c) = a × b + a × c.</p><p>Nearly every mental multiplication trick is this law in disguise. Seeing that is more valuable than memorizing the tricks.</p>`,
 moves:`<p><b>Split:</b> 23 × 7 = 140 + 21.</p><p><b>×5</b> is ×10 then halve. <b>×25</b> is ×100 then quarter. <b>×9</b> is ×10 minus one copy; <b>×99</b> is ×100 minus one copy. <b>×11</b> is ×10 plus one copy.</p><p><b>Double and halve:</b> 16 × 25 = 8 × 50 = 4 × 100. The product doesn’t change, because you multiplied by 2 and by ½.</p>`},
{id:"div", title:"Division and divisibility", gist:"Undoing multiplication, and why digit sums detect nines.",
 idea:`<p>156 ÷ 6 asks: what times 6 makes 156? Division undoes multiplication. When it doesn’t come out evenly, what’s left over is the remainder.</p>`,
 why:`<p>Why does a number divide by 9 exactly when its digits add to a multiple of 9? Because 10 = 9 + 1, every power of ten is one more than a multiple of nine (10, 100 = 99 + 1, 1,000 = 999 + 1). So 4,383 = 4×(999+1) + 3×(99+1) + 8×(9+1) + 3, which is a multiple of 9 plus 4+3+8+3. The number and its digit sum leave the same remainder when divided by 9. The rule for 3 works the same way.</p><p>For 4, only the last two digits matter, because 100 is already divisible by 4.</p>`,
 moves:`<p><b>Split the dividend</b> into parts you can divide: 156 ÷ 6 = (120 + 36) ÷ 6 = 20 + 6 = 26.</p><p><b>÷5</b> is ×2 then ÷10: 235 ÷ 5 = 470 ÷ 10 = 47.</p><div class="ex">Is 7,425 divisible by 9? 7+4+2+5 = 18, and 18 is. So yes.</div>`},
{id:"neg", title:"Negative numbers", gist:"Extending the line leftward, and a rule forced by consistency.",
 idea:`<p>−5 is the number that, added to 5, gives 0. Negative numbers extend the number line to the left of zero.</p><p>Subtracting a number is the same as adding its opposite: 3 − 8 = 3 + (−8) = −5, and 6 − (−4) = 6 + 4 = 10.</p>`,
 why:`<p>Why is a negative times a negative positive? Not by decree. Start with (−1) × 0 = 0, and write 0 as 1 + (−1):</p><div class="ex">(−1) × (1 + (−1)) = 0<br>(−1)(1) + (−1)(−1) = 0<br>−1 + (−1)(−1) = 0, so (−1)(−1) = 1.</div><p>If we want the distributive law to keep holding, the rule is forced. It is a nice case of a “convention” that turns out to be the only consistent choice.</p>`,
 moves:`<p>Think of position and movement: −7 + 12 starts at −7 and moves 12 right, landing on 5. For products, work out the size first, then the sign: an odd number of negatives makes the result negative.</p>`},
{id:"frac", title:"Fractions", gist:"Many names for one number, and why dividing flips.",
 idea:`<p>${F(3,4)} means: split one whole into 4 equal parts and take 3. It is also simply 3 ÷ 4. The same number has endless names: ${F(3,4)} = ${F(6,8)} = ${F(75,100)}.</p>`,
 why:`<p>Multiplying top and bottom by the same number is multiplying by ${F(2,2)} or ${F(5,5)}, which is 1. So the value is unchanged, only the name.</p><p>You can only add parts of the same size, which is why addition needs a common denominator. Multiplication needs none: ${F(2,3)} of ${F(3,4)} is a rectangle 2-of-3 wide and 3-of-4 tall, so ${F(6,12)}.</p><p>Dividing by ${F(1,4)} asks how many quarters fit, and 4 fit in every whole. In general, dividing by ${F("a","b")} is multiplying by ${F("b","a")}, because the two multiply to 1.</p>`,
 moves:`<p><b>Compare by cross-multiplying:</b> ${F(5,8)} vs ${F(3,5)}: 5×5 = 25 beats 3×8 = 24, so ${F(5,8)} is larger.</p><p><b>“Of” means times:</b> ${F(3,5)} of 40 is 40 ÷ 5 × 3 = 24.</p><p>Simplify before you multiply: cancel any factor shared by a top and a bottom.</p>`},
{id:"pct", title:"Decimals and percents", gist:"Place value continued rightward, and a swap that saves effort.",
 idea:`<p>Decimals continue place value to the right of the point: tenths, hundredths, thousandths. Percent means “per hundred”: 35% = ${F(35,100)} = 0.35.</p>`,
 why:`<p>x% of y is x × y ÷ 100, and so is y% of x. Multiplication doesn’t care about order, so you may always pick the easier version: 4% of 75 = 75% of 4 = 3.</p>`,
 moves:`<p><b>10%</b> moves the decimal point one place left. <b>5%</b> is half of that; <b>15%</b> is 10% plus 5%; <b>1%</b> moves it two places.</p><p>Know the common pairs: 0.5 = ½, 0.25 = ¼, 0.75 = ¾, 0.2 = ⅕, 0.125 = ⅛.</p><div class="ex">15% of 80: 10% is 8, 5% is 4, so 12.</div>`},
{id:"order", title:"Expressions and order of operations", gist:"Reading mathematical sentences without ambiguity, and a first look at unknowns.",
 idea:`<p>An expression is a sentence, and 3 + 4 × 5 would be ambiguous without an agreement. The agreement: brackets first, then powers, then × and ÷ from left to right, then + and − from left to right. So 3 + 4 × 5 = 23.</p>`,
 why:`<p>This is a convention, not a discovered truth. It was chosen because it makes the most common expressions short: 3x² + 2x + 1 needs no brackets. Distinguishing notation from mathematics matters later, when a strange-looking result is only a strange way of writing.</p><p>A letter such as x simply names a number we haven’t specified yet. Solving 3n + 4 = 19 means undoing the operations in reverse order: subtract 4, then divide by 3.</p>`,
 moves:`<p>Before calculating, find the main operation, the one done last; it tells you how the sentence is built. Watch the left-to-right traps: 10 − 4 + 3 is 9, not 3, and 24 ÷ 4 × 2 is 12, not 3.</p>`},
{id:"ratio", title:"Ratio and proportion", gist:"Comparing by multiplication rather than subtraction.",
 idea:`<p>A ratio compares two quantities by how many times one contains the other. Flour to water in the ratio 3 : 2 means 3 parts flour for every 2 parts water, whatever the size of a “part.”</p><p>A proportion says two ratios are equal: 3 : 2 = 12 : 8. A rate is a ratio with units, such as 60 km per hour or $4 per notebook.</p>`,
 why:`<p>A ratio is a fraction in disguise, so scaling both parts by the same factor leaves it unchanged, for exactly the reason ${F(3,4)} = ${F(6,8)}. Cross-multiplication is not a trick either: from ${F("a","b")} = ${F("c","d")}, multiply both sides by bd to get ad = bc.</p><p>The classic error is thinking additively where the situation is multiplicative. 2 : 3 and 4 : 5 differ by the same amount in each part, but they are not the same ratio. Asking “how many times?” rather than “how many more?” is the shift this book is about.</p>`,
 moves:`<p><b>Find the scale factor:</b> if 3 becomes 12, everything is multiplied by 4.</p><p><b>Go through one:</b> 5 notebooks for $20 means $4 each, so 8 cost $32.</p><p><b>Percent change</b> is the change divided by the original amount: $40 to $50 is +10 on 40, which is +25%.</p>`},
{id:"equations", title:"Equations and the logic of unknowns", gist:"What it means to solve, and why doing the same to both sides is legitimate.",
 idea:`<p>An equation is a claim: two expressions name the same number. 3x + 4 = 19 is true for one value of x and false for every other. Solving means finding the values that make the claim true.</p><p>The method is to do the same thing to both sides until x stands alone.</p>`,
 why:`<p>If a and b are the same number, then a + c and b + c are the same number too. That is substitution of equals, and it licenses every step. What matters is that each step can be undone, so no solution is gained or lost along the way.</p><p>Multiplying both sides by zero cannot be undone. That is why dividing by an expression that might be zero produces false “proofs” that 1 = 2.</p><p>Some equations are true for every x (x + 1 = x + 1). Others are true for none (x + 1 = x). Solving can end in either verdict.</p>`,
 moves:`<p><b>Undo in reverse order:</b> in 3x + 4 = 19, x was multiplied by 3 and then 4 was added. So subtract 4, then divide by 3.</p><p><b>Collect the unknowns</b> on one side first when x appears twice.</p><p><b>Check by substituting</b> your answer back in. It takes seconds and catches most mistakes.</p>`},
{id:"algebra", title:"Algebra: factoring and quadratics", gist:"Expanding and factoring as inverse moves, and why factoring solves equations.",
 idea:`<p>Algebra treats expressions as objects you can reshape. Expanding turns a product into a sum: (x + 3)(x + 5) = x² + 8x + 15. Factoring runs the other way.</p><p>A quadratic equation such as x² − 5x + 6 = 0 can often be solved by factoring it: (x − 2)(x − 3) = 0, so x = 2 or x = 3.</p>`,
 why:`<p>Expanding is the distributive law again. Draw (x + 3)(x + 5) as a rectangle: it splits into an x-by-x square, two strips worth 3x and 5x, and a 3-by-5 corner.</p><p>Factoring solves equations because of the zero-product property: if pq = 0, then p = 0 or q = 0. Nonzero numbers never multiply to zero. Turning a sum into a product converts one hard question into two easy ones.</p>`,
 moves:`<p>To factor x² + bx + c, look for two numbers that <b>multiply to c</b> and <b>add to b</b>.</p><p>The difference of squares is a mental-math gift: a² − b² = (a − b)(a + b), so 41 × 39 = 40² − 1² = 1,599.</p><p>Squares near round numbers: 51² = 50² + 2·50·1 + 1² = 2,601.</p>`},
{id:"geometry", title:"Geometry and the first proofs", gist:"Angles, triangles, Pythagoras, and what it means to prove.",
 idea:`<p>Euclid’s method: start from a few definitions and assumptions (postulates), then derive everything else by argument. The results here: angles on a straight line sum to 180°, the angles of a triangle sum to 180°, and in a right triangle a² + b² = c².</p>`,
 why:`<p><b>Triangle angles:</b> draw a line through one corner parallel to the opposite side. The two angles it makes with the other sides equal the triangle’s other two angles (alternate angles). Those three angles sit on a straight line, so they sum to 180°.</p><p>That proof uses the parallel postulate. On a sphere, where it fails, triangles have more than 180°. The theorem depends on which assumptions you accept, and that is a philosophically important fact about proof.</p><p><b>Pythagoras:</b> put four copies of the triangle inside a square of side a + b, leaving a tilted square of side c in the middle. Counting areas: (a + b)² = 4 · ½ab + c², which simplifies to a² + b² = c².</p>`,
 moves:`<p>Know the common right triangles: 3-4-5, 5-12-13, 8-15-17, 7-24-25, and their multiples (6-8-10, 9-12-15).</p><p>A triangle is half a parallelogram, so its area is ½ × base × height.</p><p>A polygon with n sides splits into n − 2 triangles from one corner, so its angles total (n − 2) × 180°.</p>`},
{id:"functions", title:"Functions and graphs", gist:"Rules that give exactly one output, and the geometry of straight lines.",
 idea:`<p>A function is a rule that assigns each input exactly one output. f(x) = 2x + 3 sends 4 to 11. Its graph is the set of all points (x, f(x)).</p><p>For a straight line, the slope is rise over run: how much y changes for each step in x.</p>`,
 why:`<p>“Exactly one output” is what makes f(4) a legitimate name for a number, much as a definite description must pick out one thing to refer at all.</p><p>A graph is straight exactly when equal steps in x always produce equal changes in y. That constant ratio is the slope, so the line y = mx + b has slope m, and b is where it crosses the y-axis (when x = 0).</p>`,
 moves:`<p><b>Slope</b> = (y₂ − y₁) ÷ (x₂ − x₁). Keep the order the same on top and bottom.</p><p><b>Composition</b> f(g(x)): work from the inside out.</p><p><b>To undo</b> f(x) = 3x + 2, reverse the steps: subtract 2, then divide by 3.</p>`},
{id:"exponents", title:"Exponents, logarithms and growth", gist:"Repeated multiplication, and the question logs ask.",
 idea:`<p>2⁵ = 2 × 2 × 2 × 2 × 2 = 32. A logarithm asks the reverse question: log₂ 32 is the power you raise 2 to in order to get 32, namely 5.</p><p>The laws: aᵐ × aⁿ = aᵐ⁺ⁿ, and (aᵐ)ⁿ = aᵐⁿ.</p>`,
 why:`<p>What should 2⁰ or 2⁻³ mean? “Multiply 2 by itself −3 times” is nonsense. But the law aᵐ ÷ aⁿ = aᵐ⁻ⁿ tells us what the definitions must be if the law is to keep holding: 2³ ÷ 2³ = 2⁰ forces 2⁰ = 1, and 2⁰ ÷ 2³ = 2⁻³ forces 2⁻³ = ${F(1,8)}. It is the same move as with negative numbers: extend the definition in the only consistent way.</p><p>Because exponents add when powers multiply, logarithms turn multiplication into addition. That is how slide rules and log tables made calculation fast for three centuries.</p>`,
 moves:`<p><b>2¹⁰ = 1,024 ≈ 1,000</b>, a landmark for estimating powers of two.</p><p>log₁₀ of a number is roughly its number of digits minus one.</p><p><b>Rule of 72:</b> at r% growth per year, an amount doubles in about 72 ÷ r years. It is an approximation, accurate for modest rates.</p>`},
{id:"trig", title:"Trigonometry", gist:"Why side ratios depend only on angles.",
 idea:`<p>In a right triangle, label the sides relative to an angle θ: opposite, adjacent, hypotenuse. Then sin θ = opposite ÷ hypotenuse, cos θ = adjacent ÷ hypotenuse, tan θ = opposite ÷ adjacent.</p><p>Angles can also be measured in radians: a full turn is 2π, so 180° = π.</p>`,
 why:`<p>Why can sin θ depend on the angle alone? Any two right triangles with the same angle θ are similar: one is a scaled copy of the other. Scaling multiplies every side by the same factor, so the ratios between sides don’t change.</p><p>Put the hypotenuse on a circle of radius 1. The point has coordinates (cos θ, sin θ), and Pythagoras gives sin²θ + cos²θ = 1. This is also how trigonometry extends past 90°.</p>`,
 moves:`<p>Half an equilateral triangle gives 30°-60°-90° with sides 1, √3, 2, so sin 30° = ½. A square cut on its diagonal gives 45°-45°-90°, so tan 45° = 1.</p><p>On the unit circle, the sign of cos is the sign of x and the sign of sin is the sign of y.</p><p>Degrees to radians: multiply by ${F("π",180)}.</p>`},
{id:"probability", title:"Probability and statistics", gist:"Counting outcomes, independence, and summarizing data.",
 idea:`<p>When outcomes are equally likely, the probability of an event is favourable outcomes divided by total outcomes. A fair die shows an even number with probability ${F(3,6)} = ${F(1,2)}.</p><p>The mean of a list is its total divided by its length. The median is the middle value once sorted.</p>`,
 why:`<p>“Equally likely” is an assumption, not a discovery, and choosing what counts as an equally likely outcome can be contested (Bertrand’s paradox is the classic case). With two dice, the 36 ordered pairs are equally likely; the 11 possible sums are not.</p><p>For independent events, P(A and B) = P(A) × P(B): among the outcomes where A happens, B happens in the same proportion as always.</p><p>The mean is a balance point: the distances above it exactly cancel the distances below.</p>`,
 moves:`<p><b>Use the complement:</b> P(at least one head in 3 flips) = 1 − P(no heads) = 1 − ${F(1,8)} = ${F(7,8)}.</p><p><b>Multiplication principle:</b> 3 shirts and 4 trousers make 12 outfits.</p><p>Pairs from n people: n(n − 1) ÷ 2, since each pair would otherwise be counted twice.</p>`},
{id:"calculus", title:"Calculus: change and accumulation", gist:"Instantaneous rates, areas under curves, and how they connect.",
 idea:`<p>The derivative f′(x) is the instantaneous rate of change of f: the slope of the curve at a point. The integral adds up accumulated quantity: the area under a curve.</p><p>The fundamental theorem of calculus says these are inverse operations.</p>`,
 why:`<p>Slope needs two points, so how can a single point have one? Take the slope between x and x + h, then see what it approaches as h shrinks. For f(x) = x²:</p><div class="ex">(x + h)² − x² = 2xh + h², and dividing by h gives 2x + h.<br>As h approaches 0, this approaches 2x.</div><p>Berkeley mocked early calculus for dividing by quantities that were then treated as zero, calling them “ghosts of departed quantities.” The modern idea of a limit answers him: we never set h = 0, we ask what value the expression approaches.</p>`,
 moves:`<p><b>Power rule:</b> the derivative of xⁿ is nxⁿ⁻¹. So 5x³ becomes 15x².</p><p><b>Reverse it to integrate:</b> xⁿ comes from ${F("xⁿ⁺¹","n + 1")}. The area under 3x² from 0 to b is b³.</p><p>A smooth curve’s highest or lowest point has slope zero, so set f′(x) = 0.</p>`},
{id:"linear", title:"Linear algebra", gist:"Vectors, matrices as transformations, and what the determinant measures.",
 idea:`<p>A vector is a list of numbers, pictured as an arrow: (3, 4). Vectors add component by component. A matrix transforms vectors; multiplying a matrix by a vector applies the transformation.</p><p>The dot product (a, b)·(c, d) = ac + bd measures how much two vectors point the same way.</p>`,
 why:`<p>A linear transformation respects addition and scaling, so it is completely determined by what it does to (1, 0) and (0, 1). Those two images are the matrix’s columns. That is why matrix multiplication works the way it does.</p><p>The determinant ad − bc of ${M(["a","b","c","d"])} is the factor by which the transformation scales areas. If it is 0, the plane gets flattened onto a line, information is lost, and the transformation cannot be undone. That is exactly when a system of equations fails to have a single solution.</p>`,
 moves:`<p>Two vectors are perpendicular exactly when their dot product is 0.</p><p>The length of (a, b) is √(a² + b²): Pythagoras again.</p><p>To read a matrix, look at its columns: they show where the two basic arrows land.</p>`},
{id:"connectives", title:"Statements and connectives", gist:"Not, and, or, if-then: the grammar underneath every argument.",
 idea:`<p>Logic starts with statements: sentences that are true or false. Connectives build bigger statements from smaller ones: ¬P (not P), P ∧ Q (P and Q), P ∨ Q (P or Q, or both), P → Q (if P then Q), P ↔ Q (P if and only if Q).</p><p>The truth of the whole depends only on the truth of the parts, so a truth table can list every case.</p>`,
 why:`<p>The surprising row is the conditional. P → Q is counted false only when P is true and Q is false. When P is false the conditional is “vacuously” true. Read it as a promise: “If you finish, I’ll pay you” is broken only if you finish and go unpaid.</p><p>Whether this captures ordinary “if” is a long-running debate (the paradoxes of material implication). It is the version mathematics uses because it is the weakest claim that still licenses the step from P to Q.</p><p>De Morgan’s laws show how negation moves through: ¬(P ∧ Q) is ¬P ∨ ¬Q, and ¬(P ∨ Q) is ¬P ∧ ¬Q. “Not both” means at least one fails; “neither” means both fail.</p>`,
 moves:`<p>Work from the inside out, writing the value of each sub-part.</p><p>With n letters a truth table has 2ⁿ rows, since each letter doubles the cases.</p><p>A tautology is true in every row. To show something is <em>not</em> a tautology, one falsifying row is enough.</p>`},
{id:"arguments", title:"Conditionals and valid arguments", gist:"Converse, contrapositive, and which inferences actually follow.",
 idea:`<p>An argument is valid when the conclusion must be true whenever the premises are. Validity is about form, not about whether the premises are actually true.</p><p>From “if P then Q” we can build the converse (if Q then P), the inverse (if not P then not Q) and the contrapositive (if not Q then not P).</p>`,
 why:`<p>Only the contrapositive is equivalent to the original. Both say the same thing: the case “P true, Q false” never occurs.</p><p>Two valid forms follow. <b>Modus ponens:</b> if P then Q; P; so Q. <b>Modus tollens:</b> if P then Q; not Q; so not P.</p><p>Two invalid look-alikes don’t. <b>Affirming the consequent:</b> if it rains the street is wet; the street is wet; so it rained. A burst pipe would do it. <b>Denying the antecedent</b> fails for the same reason. To show a form invalid, find one case with true premises and a false conclusion.</p>`,
 moves:`<p>Translate to letters before judging. A familiar subject makes invalid arguments feel valid when the conclusion happens to be true.</p><p>“P only if Q” means P → Q. “P unless Q” means ¬Q → P.</p><p>Mathematical “or” is inclusive: knowing P tells you nothing about Q.</p>`},
{id:"quantifiers", title:"Quantifiers and counterexamples", gist:"All, some, none, and how a single case refutes a universal claim.",
 idea:`<p>“All,” “some” and “no” are quantifiers. “Every even number greater than 2 is a sum of two primes” is a claim about infinitely many cases at once.</p><p>Negation swaps them: the opposite of “all swans are white” is “some swan is not white,” not “no swans are white.”</p>`,
 why:`<p>An asymmetry follows. A universal claim is refuted by one counterexample, but confirmed by no finite number of examples. n² + n + 41 is prime for n = 0, 1, 2, … all the way to 39, then fails at 40. This is Popper’s asymmetry between verification and falsification in miniature.</p><p>The order of quantifiers matters too. “For every number there is a larger one” is true. “There is a number larger than every number” is false. Same words, different order, different claim.</p>`,
 moves:`<p>To deny “all,” find one exception. To deny “some,” you must show none.</p><p>Hunt for counterexamples at the edges: 0, 1, 2, negatives, and the smallest case the claim allows.</p>`},
{id:"sets", title:"Sets and counting", gist:"Collections, overlaps, and counting without listing.",
 idea:`<p>A set is a collection of things, its members. A ∪ B (union) contains everything in either set; A ∩ B (intersection) contains what is in both; A ⊆ B means every member of A is in B.</p><p>Counting is about the sizes of such sets, often without listing them.</p>`,
 why:`<p><b>Inclusion–exclusion:</b> |A ∪ B| = |A| + |B| − |A ∩ B|. Adding the two sizes counts the overlap twice, so remove it once.</p><p><b>Subsets:</b> a set of n things has 2ⁿ subsets, because each member is either in or out, independently. This is the same doubling as truth-table rows.</p><p><b>Arrangements:</b> n things can be ordered in n! = n × (n − 1) × … × 1 ways. To choose k without caring about order, count ordered choices and divide by k!, the number of orders each group was counted in.</p>`,
 moves:`<p>Draw the Venn diagram and fill in the overlap first.</p><p>Ask whether order matters. Podium places: yes. A committee: no.</p><p>Small cases first. Before trusting a formula, check it on n = 2 or 3 by listing.</p>`},
{id:"proof", title:"Methods of proof", gist:"Direct proof, contradiction, contrapositive, induction, and what each buys you.",
 idea:`<p>A proof is an argument that leaves no case unaccounted for. A handful of methods covers most of mathematics: direct proof, proof by contrapositive, proof by contradiction, proof by induction, and refutation by counterexample.</p>`,
 why:`<p><b>Direct:</b> if n is even, write n = 2k; then n² = 4k² = 2(2k²), which is even.</p><p><b>Contradiction:</b> suppose there are finitely many primes. Multiply them all and add 1. The result leaves remainder 1 when divided by each prime on the list, so its prime factors are not on the list. The supposition fails.</p><p><b>Induction:</b> prove a claim for n = 1, then prove that if it holds for some n, it holds for n + 1. Like dominoes, that covers every case. 1 + 2 + … + n = n(n + 1) ÷ 2 can also be seen directly: pair 1 with n, 2 with n − 1, and so on. Each pair sums to n + 1.</p>`,
 moves:`<p>Parity arguments are the workhorse: write evens as 2k and odds as 2k + 1, then expand.</p><p>Products of consecutive numbers hide divisibility. Of any two consecutive numbers one is even; of any three, one is a multiple of 3.</p><p>If a direct proof stalls, try the contrapositive.</p>`},
{id:"numeracy", title:"Reasoning with numbers", gist:"Base rates, relative risk, misleading averages, and correlation.",
 idea:`<p>Many bad arguments are numerical. A test is “90% accurate,” a risk “doubles,” an average looks typical. Each can mislead without any number being false.</p><p>This book applies what came before to claims you meet in news, medicine and policy.</p>`,
 why:`<p><b>Base rates:</b> if a condition is rare, most positive tests can be false positives even with an accurate test, because the healthy group is so much larger. Thinking in counts (“out of 100,000 people…”) rather than percentages makes this visible.</p><p><b>Relative versus absolute risk:</b> a rise from 2 to 3 cases in 10,000 is a 50% relative increase but one extra case per 10,000 people.</p><p><b>Correlation:</b> two things can rise together because a third thing drives both. Shoe size and reading ability correlate in children because both grow with age.</p>`,
 moves:`<p>Convert percentages into counts of people.</p><p>Always ask: percent of what? A rise then fall of the same percent is a net loss, because the second percent is taken of a bigger number.</p><p>When the mean and median differ a lot, a few extreme values are pulling the mean.</p>`}
];

const EXTRA={
place:{plain:`A numeral like 4,382 is a short way of saying “4 thousands, 3 hundreds, 8 tens and 2 ones.” Where a digit sits decides what it is worth. Zero is the placeholder that keeps the other digits in their right places.`,
 mistake:`Dropping the placeholder zero. In 3,052 there are no hundreds, but the 0 still has to be there. Leave it out and you have written 352.`},
addsub:{plain:`You can add numbers in any order and any grouping, so regroup to make the sums easy. Subtraction asks how far apart two numbers are, and that distance does not change if you slide both numbers by the same amount.`,
 mistake:`Treating subtraction like addition. 5 − 3 and 3 − 5 are different, so you can only shift both numbers together, never swap them.`},
mult:{plain:`Multiplying is finding the area of a rectangle. Cut the rectangle into easier pieces, work out each piece, and add them up. Almost every mental-math trick is this cutting in disguise.`,
 mistake:`Multiplying only part of the number. In 7 × 23, both pieces get multiplied: 7 × 20 and 7 × 3. Writing 7 × 20 + 3 forgets the 7 on the second piece.`},
div:{plain:`Division asks “how many groups?” or “how much in each group?” and the leftover is the remainder. A number divides evenly by 9 when its digits add up to a multiple of 9, and the same trick works for 3.`,
 mistake:`Using the digit-sum trick on the wrong number. Adding digits works for 3 and 9. For 4 you look at the last two digits instead.`},
neg:{plain:`Negative numbers are the numbers to the left of zero. Adding moves you right, adding a negative moves you left, and subtracting a negative moves you right, because it undoes a move left. Two negatives multiplied give a positive.`,
 mistake:`Reading the dash as one thing. In 6 − (−4) the first dash means subtract and the second means negative. Subtracting a negative gives 6 + 4 = 10, not 2.`},
frac:{plain:`A fraction is a number of equal parts out of a whole, and it is also a division. One amount has many names (1/2 = 2/4 = 50/100). You can only add parts of the same size, so match the sizes first.`,
 mistake:`Adding the tops and the bottoms. 1/2 + 1/3 is not 2/5. The pieces are different sizes, so rename them as 3/6 and 2/6 first, which gives 5/6.`},
pct:{plain:`Percent means “out of 100,” so 35% is 35 hundredths, or 0.35. 10% is the easy one: move the decimal point one place left. Build other percents out of it.`,
 mistake:`Forgetting which number the percent is “of.” A price that rises 50% and then falls 50% does not return to where it started, because the second 50% is taken of a bigger amount.`},
order:{plain:`When a line of math could be read two ways, we agree on a reading order: brackets, then powers, then multiply and divide (left to right), then add and subtract (left to right). A letter like x just stands for a number we have not found yet.`,
 mistake:`Always doing multiplication before division, or addition before subtraction. They are on the same level, so go left to right: 24 ÷ 4 × 2 is 12, not 3.`},
ratio:{plain:`A ratio compares two amounts by asking how many times one fits into the other. If both parts are multiplied by the same number, the ratio stays the same. Ask “how many times?” rather than “how many more?”`,
 mistake:`Adding when you should multiply. 2 : 3 and 4 : 5 are not the same ratio, even though both parts went up by 2. To keep a ratio, multiply both parts by the same number.`},
equations:{plain:`An equation says two sides are equal. To solve it, do the same thing to both sides until the unknown is alone, undoing the steps in reverse order. Then check by putting your answer back in.`,
 mistake:`Changing only one side. If you subtract 4 from the left, subtract 4 from the right too, or the balance is broken.`},
algebra:{plain:`Expanding turns a product into a sum, like (x + 3)(x + 5) = x² + 8x + 15. Factoring goes back the other way. If two things multiply to zero, one of them must be zero, which is why factoring solves quadratics.`,
 mistake:`Forgetting the middle terms. (x + 3)² is not x² + 9. There are two strips of 3x as well: x² + 6x + 9.`},
geometry:{plain:`Geometry starts from a few simple assumptions and builds everything else by argument. The angles of a triangle total 180°, and in a right triangle the squares on the two short sides add up to the square on the long side.`,
 mistake:`Using a² + b² = c² on a triangle that is not a right triangle, or letting c be one of the short sides. The c is always the longest side, opposite the right angle.`},
functions:{plain:`A function is a rule that gives exactly one answer for each input. A straight-line graph has a steady slope: the same rise for every step to the right. In y = mx + b, m is the slope and b is the starting height.`,
 mistake:`Flipping rise and run, or taking the two points in different orders on top and bottom. Slope is the change in y over the change in x, with both subtractions done in the same order.`},
exponents:{plain:`An exponent counts repeated multiplication: 2⁵ means five 2s multiplied together. A logarithm asks the reverse question: what power turns 2 into 32? When you multiply powers of the same base, the exponents add.`,
 mistake:`Multiplying the exponents when you should add them. 2³ × 2⁴ is 2⁷, not 2¹². Multiplying exponents is for a power of a power, like (2³)⁴.`},
trig:{plain:`In a right triangle, the ratios between the sides depend only on the angle, not on the size of the triangle. Sine, cosine and tangent are names for those ratios. Radians are another way to measure angles, where a half turn is π.`,
 mistake:`Mixing up “opposite” and “adjacent.” They are named relative to the angle you are looking at, so they swap if you look from the other corner.`},
probability:{plain:`Probability is the number of outcomes you would be happy with, divided by the number of equally likely outcomes in all. The mean is the total shared out evenly. The median is the middle value once the list is sorted.`,
 mistake:`Counting outcomes that are not equally likely. With two dice, a sum of 7 is far more likely than a sum of 2. Count the 36 ordered pairs instead of the 11 sums.`},
calculus:{plain:`The derivative tells you how fast something is changing at one instant, like the slope of a curve at a point. The integral adds up a changing amount, like the area under a curve. Each undoes the other.`,
 mistake:`Forgetting to lower the power. The derivative of x³ is 3x², not 3x³. Bring the exponent down as a multiplier, then reduce the exponent by one.`},
linear:{plain:`A vector is a list of numbers, drawn as an arrow. A matrix is a machine that moves and stretches arrows. The determinant says how much the machine scales areas; if it is zero, everything gets squashed flat.`,
 mistake:`Multiplying matrices entry by entry. Rows of the first matrix pair up with columns of the second, and A × B is usually not the same as B × A.`},
connectives:{plain:`Logic is built from statements that are true or false, joined by “not,” “and,” “or” and “if…then.” The truth of the whole depends only on the truth of the parts, so you can list every case in a table.`,
 mistake:`Thinking “if P then Q” is false when P is false. It is only false when P is true and Q is false, like a broken promise. Otherwise it counts as true.`},
arguments:{plain:`An argument is valid when the conclusion has to be true if the premises are. “If P then Q” says the same as “if not Q then not P” (the contrapositive), but not the same as “if Q then P” (the converse).`,
 mistake:`Swapping an if-then around. “If it rains, the street is wet” does not give “if the street is wet, it rained.” A burst pipe could do it.`},
quantifiers:{plain:`“All,” “some” and “none” say how many cases a claim covers. One counterexample is enough to refute an “all” claim, but no number of examples can prove it. The order of “for every” and “there is” changes the meaning.`,
 mistake:`Turning “all” into “none” when you negate. The opposite of “all swans are white” is “some swan is not white,” not “no swan is white.”`},
sets:{plain:`A set is a collection, and counting is about its size. To count what is in either of two overlapping sets, add the sizes and subtract the overlap once. Each extra item doubles the number of possible subsets.`,
 mistake:`Counting the overlap twice. If 20 like tea, 15 like coffee and 8 like both, that is 20 + 15 − 8 = 27 people, not 35.`},
proof:{plain:`A proof is an argument that leaves no case out. A direct proof reasons straight from the starting facts. Contradiction assumes the opposite and shows it falls apart. Induction proves a first case and a step from each case to the next.`,
 mistake:`Proving by example. Checking that a claim works for 1, 2 and 3 does not prove it for every number. You need an argument that covers every case at once.`},
numeracy:{plain:`Many misleading claims use numbers that are true but incomplete. Turn percentages into counts of people, ask “percent of what?”, and remember that two things moving together does not mean one causes the other.`,
 mistake:`Judging a test by its accuracy alone. If a condition is rare, even an accurate test gives mostly false alarms, because there are so many more healthy people than sick ones.`}
};

const NEWUNITS=[
{id:"primes", title:"Primes and factorization", gist:"The building blocks of whole numbers, and why each number has one recipe.",
 idea:`<p>A prime is a whole number greater than 1 whose only factors are 1 and itself: 2, 3, 5, 7, 11, 13 … Every other number above 1 is composite, which means it splits into smaller factors.</p><p>Every whole number above 1 is a product of primes in exactly one way, apart from order: 360 = 2 × 2 × 2 × 3 × 3 × 5 = 2³ × 3² × 5. Finding that recipe is called prime factorization.</p>`,
 why:`<p>Primes are the atoms of multiplication. Split a number into factors, split those factors again, and you must stop at primes. That the recipe is always the same, whichever way you split, is the fundamental theorem of arithmetic. It is why the recipe is so useful for finding what two numbers have in common.</p><p>To test whether n is prime, you only need to try primes up to √n. If n had a factor bigger than √n, it would be paired with one smaller than √n, which you would already have found. For 97, √97 is just under 10, so testing 2, 3, 5 and 7 is enough.</p><p>There are infinitely many primes. The argument is in the Methods of proof book.</p>`,
 moves:`<p><b>Quick tests:</b> divisible by 2 if it ends in an even digit; by 3 or 9 if the digit sum is; by 5 if it ends in 0 or 5; by 10 if it ends in 0.</p><p><b>Factor tree:</b> peel off the smallest prime you can, then repeat on what is left.</p><p><b>Greatest common factor:</b> take the primes both numbers share, each to the smaller power. <b>Least common multiple:</b> take every prime that appears, each to the larger power. For 12 = 2² × 3 and 18 = 2 × 3²: the greatest common factor is 2 × 3 = 6, and the least common multiple is 2² × 3² = 36.</p>`,
 plain:`A prime is a number that cannot be split into smaller whole-number factors, like 7 or 13. Every other number is built from primes in just one way, so you can break any number down into its prime “recipe” (360 = 2 × 2 × 2 × 3 × 3 × 5). That recipe makes it easy to find what two numbers have in common.`,
 mistake:`Calling 1 a prime, or forgetting that 2 is prime (and the only even prime). A prime has exactly two factors, and 1 has only one. Also, odd does not mean prime: 9 and 15 are odd and composite.`},
{id:"words", title:"Word problems", gist:"Turning a story into an equation, and checking the answer against the story.",
 idea:`<p>A word problem is an equation told as a story. The skill is translation: say what the unknown is, turn each phrase into math, write one equation saying two things are equal, solve it, and check the answer against the story.</p><p>Common translations: “is” means =, “more than” means +, “times as many” means ×, and “per” means a rate (a division, or a multiplier).</p>`,
 why:`<p>Writing “let x be the number of apples” forces you to say exactly what you are looking for. Many errors are really misreadings of what x stands for.</p><p>An equation is a claim that two descriptions of the same quantity agree. Total cost described as price × quantity must equal the total cost described as what was paid. Finding two descriptions of one quantity is the heart of most word problems.</p><p>The final check is part of the method, not an extra. A negative number of people, or half a ticket, means something went wrong in the translation.</p>`,
 moves:`<p><b>Write “Let x be …”</b> before anything else.</p><p><b>Look for two ways to say the same total</b>: cost, distance, ages, counts.</p><p><b>Reread the question</b> after you solve. Did you answer what was asked? It might want the other number, or twice x.</p>`,
 plain:`A word problem is an equation told as a story. Say what the unknown is, turn each phrase into math, write one equation, solve it, then check that the answer fits the story. Reread the question at the end to make sure you answered what was asked.`,
 mistake:`Answering with x when the question asks for something built from x. If x is the younger sister’s age and the question asks for the older sister’s age, there is one more step.`},
{id:"ineq", title:"Inequalities", gist:"Solving with &lt;, &gt;, ≤ and ≥, and the one rule that flips.",
 idea:`<p>An inequality says one side is bigger or smaller than the other. 3x + 1 &lt; 10 is true for many values of x, not just one, and the answer is a whole range: here x &lt; 3.</p><p>You solve it like an equation, with one new rule: if you multiply or divide both sides by a negative number, the inequality sign flips.</p>`,
 why:`<p>Adding or subtracting the same number on both sides keeps the order: since 2 &lt; 5, also 2 + 10 &lt; 5 + 10. Multiplying by a positive number keeps it too: 2 &lt; 5 gives 6 &lt; 15.</p><p>Multiplying by a negative reverses the order, because it reflects the number line through zero. 2 &lt; 5, but −2 &gt; −5, since −2 sits to the right of −5. So −3x &lt; 12 becomes x &gt; −4: the sign flips when you divide by −3.</p><p>A strict sign (&lt; or &gt;) leaves out the endpoint, while ≤ and ≥ include it.</p>`,
 moves:`<p><b>Solve like an equation</b>, then test one number inside your answer range and one outside it.</p><p><b>Flip the sign</b> only when you multiply or divide by a negative.</p><p><b>Counting whole numbers:</b> for x ≥ 3 and x ≤ 7 they are 3, 4, 5, 6, 7, which is 7 − 3 + 1 = 5 of them.</p>`,
 plain:`An inequality says one side is bigger or smaller than the other, so the answer is a whole range of numbers rather than just one. You solve it like an equation, with one twist: when you multiply or divide both sides by a negative number, the sign flips. Check by trying a number from your answer.`,
 mistake:`Forgetting to flip the sign when dividing by a negative. −2x &gt; 6 gives x &lt; −3, not x &gt; −3. Test x = −5: −2 × (−5) = 10, which is more than 6, and −5 is less than −3.`},
{id:"roots", title:"Square roots", gist:"Undoing squaring, and why some roots never end.",
 idea:`<p>The square root of n, written √n, is the positive number that gives n when multiplied by itself. √49 = 7 because 7 × 7 = 49. Numbers like 1, 4, 9, 16, 25 are called perfect squares.</p><p>Most roots are not whole numbers. √2 is about 1.414, and its decimal never ends or repeats.</p>`,
 why:`<p>Squaring and taking a square root are inverses, like adding and subtracting. The root of a perfect square is exact. For anything else you can bracket it: √50 lies between 7 and 8, since 49 &lt; 50 &lt; 64, and it is a little over 7 because 50 is just past 49.</p><p>Roots split over multiplication: √a × √b = √(ab). So √72 = √(36 × 2) = 6√2. They do not split over addition: √9 + √16 = 3 + 4 = 7, but √25 = 5.</p><p>√2 cannot be written as a fraction. The proof is a contradiction argument from the Methods of proof book, and it was one of the first shocks in mathematics: not every length is a ratio of whole numbers.</p>`,
 moves:`<p>Know the squares up to 15 × 15 (1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225) and many roots can be read at sight.</p><p><b>Estimate:</b> √50 is between 7 and 8, and closer to 7. Check: 7.1² = 50.41.</p><p><b>Simplify:</b> pull out the biggest perfect square. √48 = √(16 × 3) = 4√3.</p>`,
 plain:`The square root of a number is what you multiply by itself to get it: √49 = 7 because 7 × 7 = 49. Most square roots are not whole numbers, so you estimate them between two neighbouring whole numbers. Roots work well with multiplication (√4 × √9 = √36) but not with addition.`,
 mistake:`Adding under the root. √9 + √16 is 3 + 4 = 7, not √25 = 5. Roots split over multiplication, not over addition.`},
{id:"sci", title:"Scientific notation", gist:"Writing very big and very small numbers by counting places.",
 idea:`<p>Scientific notation writes a number as a × 10ⁿ, where a is at least 1 and less than 10, and n is a whole number that can be negative. So 52,000 = 5.2 × 10⁴ and 0.00037 = 3.7 × 10⁻⁴.</p><p>The exponent n tells you how many places the decimal point moved: positive for big numbers, negative for small ones.</p>`,
 why:`<p>This is place value joined to the exponent rule from the Exponents book. Multiplying by 10 shifts the point one place right, and dividing by 10 shifts it one place left. So 10⁴ means four shifts right, and 10⁻⁴ means dividing by 10 four times.</p><p>When you multiply, the leading numbers multiply and the exponents add: (3 × 10⁴)(2 × 10³) = 6 × 10⁷. The answer may need tidying: (4 × 10⁵)(5 × 10³) = 20 × 10⁸ = 2 × 10⁹.</p><p>The exponent is the order of magnitude, roughly how many digits the number has. That makes sizes comparable at a glance.</p>`,
 moves:`<p><b>Count the jumps:</b> 4,500,000 → the point jumps 6 places left → 4.5 × 10⁶. And 0.0072 → 3 places right → 7.2 × 10⁻³.</p><p><b>Compare exponents first.</b> A bigger exponent wins, whatever the leading numbers are.</p><p><b>To multiply</b>, multiply the leading numbers and add the exponents, then tidy so the leading number is between 1 and 10.</p>`,
 plain:`Scientific notation is a shorthand for very big or very small numbers: 52,000 becomes 5.2 × 10⁴. The small raised number counts how many places the decimal point moved, and it is negative for tiny numbers. To compare sizes, look at the exponent first.`,
 mistake:`Getting the direction wrong for small numbers. 0.0072 is 7.2 × 10⁻³ (the exponent is negative), not 7.2 × 10³, which is 7,200.`},
{id:"sequences", title:"Sequences and patterns", gist:"Steady steps, steady multipliers, and adding up a run of terms.",
 idea:`<p>A sequence is a list of numbers in order. In an arithmetic sequence you add the same step each time (3, 7, 11, 15 … adds 4). In a geometric sequence you multiply by the same factor each time (3, 6, 12, 24 … doubles).</p><p>The nth term of an arithmetic sequence with first term a and step d is a + (n − 1)d. For a geometric sequence with factor r it is a × rⁿ⁻¹.</p>`,
 why:`<p>To reach the nth term you take n − 1 steps from the first term, not n, because the first term needs no step. That is why the formula has (n − 1).</p><p>To add up an arithmetic run, pair the first term with the last, the second with the second-to-last, and so on. Every pair has the same total, so the sum of n terms is n × (first + last) ÷ 2. It is the same pairing trick as 1 + 2 + … + n.</p><p>Geometric sequences grow or shrink by multiplying, which is why they connect to exponents, compound interest and the rule of 72. A factor above 1 grows, a factor between 0 and 1 shrinks, and a negative factor flips the sign each time.</p>`,
 moves:`<p><b>Find the rule first:</b> subtract neighbouring terms (same difference means arithmetic) or divide them (same ratio means geometric).</p><p><b>Count steps, not terms:</b> from the 4th term to the 10th is 6 steps.</p><p><b>Sum of an arithmetic run:</b> the number of terms times the average of the first and last.</p>`,
 plain:`A sequence is a list of numbers that follows a rule. If you add the same amount each time it is arithmetic, and if you multiply by the same amount each time it is geometric. To find a late term, count the steps from the start. To add up a run of terms, pair the ends.`,
 mistake:`Using n steps instead of n − 1. In 3, 7, 11, 15 the 4th term is 3 + 3 × 4 = 15, because only three steps were taken from the first term.`}
];
